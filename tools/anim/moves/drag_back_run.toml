# Drag-back braking from a jog (5.3 m/s): the left foot lands ahead of him as a hard braking plant while the right sole lands on
# the rolling ball; his run is gone 0.21 s into the move (braking at up to 30 m/s^2), he hops the left foot back 0.24 m and opens his hips a quarter turn toward
# the playing foot while the sole pulls the ball 0.87 m straight back along his run; the sole lets go with the ball at rest 0.25 m
# behind his hip line and 0.15 m to the playing foot's side, so he stands side-on to it, and the right foot steps down behind it.
# Same events at the same normalised times as drag_back.toml. Clips drag_back_right_run, drag_back_left_run.
#
# Written in the ground frame: every position is where he and the ball are on the pitch from under his hips at the start, his
# real travel (0.62 m forward to the stop, then back). The pelvis keys every 1/30 s are his path (the sheet's root is their
# low-pass) and the root yaw keys his facing; the ball's keys from the contact to the release are its path on the pitch (the
# sheet's pitch leg). The stances are flagged in [stance], so the runtime holds each foot where it landed.

name = "drag_back"
move = "drag_back"
side = "none"
foot = "right"
entry = "run"
entry_speed = 5.3
notes = "drag-back braking from a jog: a hard braking plant with the left foot, the sole stops the ball and pulls it 0.87 m back to rest behind his hip line while he hops back and opens a quarter turn, ending side-on to it"

[events]
start = 0.0
contact = 0.1714                 # the sole lands on the ball
release = 0.6857                 # the sole lets go, the ball at rest behind his hip line (the move's end tick)
end = 1.0                         # side-on, balanced, ready to go

[[variant]]
suffix = "_run"
spans = [0.12, 0.36, 0.22]

[ball]
radius = 0.11
on = ["contact", "release"]

# each foot's stances (normalised times)
[stance]
left = [[0.0714, 0.3333], [0.5239, 1]]
right = [[0.8857, 1]]

# The move sheet (data/moves/sheets.json): the ball's legs, the exit rule and how far the left stick may turn its frame.
[sheet]
entry_speed = 5.3
steer_deg = 0
plant = [[0.0, 0.6571]]             # the braking plant and the hop back ...
plant_accel = 30                  # ... where he stops harder than a plant's 20 m/s^2 (the card's stop needs it), at most 30

[[sheet.leg]]
from = "contact"
to = "release"
anchor = "pitch"
foot = "right"
surface = "sole"

[sheet.exit]
kind = "touch"
min_deg = 60
max_deg = 180
push = "jog"

# The card: what the solved clip must measure (tools/anim/clip_measures.py, card_measures).
[card]
pull_m = [0.86, 0.94]              # the ball is pulled back along his run on the pitch
end_behind_m = [0.20, 0.30]       # and ends at rest this far behind his hip line ...
end_side_m = [0.10, 0.18]         # ... and to the playing foot's side
hop_m = [0.20, 0.30]              # he hops back
open_deg = [85, 95]               # and opens toward the playing foot's side: side-on to the ball
drop_m = [0.05, 0.20]             # the sell: he sits into it
stop_share = [0.0, 0.45]          # his pace along the run is gone by this share of the move



# Drag-back braking from a run (laid out on the jog replay, entry 4.6 m/s): the left foot, taken off the run at the move's first
# frame, springs into a jump-stop and lands hard just ahead of him as the right sole lands on the rolling ball and stops it; his
# run dies over that braking plant while he sits back on it, the left foot steps back off the pitch as he rocks back, lands beside
# the ball's path and stands there while the sole pulls the ball back under him (the simulation's drag_back_step_back); then the
# right foot comes off the ball and steps down out to its right. Same events at the same normalised times as drag_back.toml. The
# exit touch is always the playing foot's (the core picks both feet by the ball's side of him, which the drag does not change), so
# the move has one ending. Clips drag_back_right_run, drag_back_left_run.
#
# Laid out on the simulation's path (the core's drag-back from 4.6 m/s: 0.56 m of run through the 0.10 s reach, braking to a stop
# 0.16 m further at 0.19 s, then 0.52 m back by 0.47 s): every position is the simulation's (his place, the ball's) less where the
# clip's root is then. The root stands still (the first and last frames' hips are both over the start), so the clip is drawn in
# his own frame: the hips stay over the start and the feet and the ball are where they are against him in the simulation at the
# time each key stands for (its label gives it, seconds after the move's start tick). A stance is fixed in the clip where its foot
# lands; the support foot's stances are flagged in [stance], so the runtime holds the foot on the pitch where it landed while the
# simulation carries him over it, then lets it go from there. The first, at the first frame and only two frames
# long, hands the left foot over from the run (the runtime steps it from wherever the run left it, lifted, instead of letting it
# drag over the pitch while it blends in); the braking plant and the stance after the step back each stand under less than 0.5 m of
# his travel at a jog or a sprint.

name = "drag_back"
move = "drag_back"
side = "none"
foot = "right"
entry = "run"
entry_speed = 3.0
notes = "drag-back braking from a run: a hard braking plant with the left foot, the sole stops the ball and pulls it back under him while the left foot steps back and lands beside it, rock back, neutral exit"

[sim]
reach_s = 0.10
drag_s = 0.40
player_step_back_m = 0.52
run_stop_share = 0.4              # DragBackStopShare: the run dies linearly over this share of the drag
entry_speed = 4.6
ball_start = [-0.032, 0.11, 0.437]
ball_radius = 0.11

[events]
start = 0.0
contact = 0.2
release = 0.75
end = 1.0

[[variant]]
suffix = "_run"
spans = [0.12, 0.40, 0.20]

[ball]
radius = 0.11
on = ["contact", "release"]

# the left foot: its hand-over from the run, the braking plant, the stance after the step back; the right foot's step down after the
# release (normalised times)
[stance]
left = [[0.0, 0.04047], [0.21833, 0.44234], [0.52923, 1.0]]
right = [[0.925, 1.0]]

# The move sheet (data/moves/sheets.json): the ball's legs, the exit rule and how far the left stick may turn its frame.
[sheet]
entry_speed = 4.60             # the pace he comes in at, m/s (this file is drawn in his own frame: its root stands still)
steer_deg = 0

[[sheet.leg]]
from = "contact"
to = "release"
anchor = "pitch"
foot = "right"
surface = "sole"

[sheet.exit]
kind = "touch"
min_deg = 60
max_deg = 180
push = "jog"


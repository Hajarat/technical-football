# Drag-back from standing: the right sole lands on the ball and pulls it 0.70 m straight back along his run while he rocks back
# onto the left (support) leg, hops it back 0.22 m and opens his hips a quarter turn toward the playing foot; the sole lets go with
# the ball at rest 0.25 m behind his hip line and 0.15 m to the playing foot's side, so he stands side-on to it, and the right foot
# steps down behind it. The simulation's drag-back has no side: the foot is the preferred one unless the ball is clearly on the
# other side, so the clips are named by the foot (drag_back_right, and the mirror drag_back_left). drag_back_run.toml and
# drag_back_sprint.toml are the same move braking from a jog and from a sprint. Conventions as in ball_roll.toml.
#
# Written in the ground frame: every position is where he and the ball are on the pitch from under his hips at the start. The
# pelvis keys every 1/30 s are his path (the sheet's root is their low-pass) and the root yaw keys his facing; the ball's keys
# from the contact to the release are its path on the pitch (the sheet's pitch leg).

name = "drag_back"
move = "drag_back"
side = "none"
foot = "right"
entry = "stand"
entry_speed = 0.0
notes = "drag-back from standing: the right sole pulls the ball 0.70 m back to rest behind his hip line while he hops back and opens a quarter turn toward the playing foot, ending side-on to it"

[events]
start = 0.0
contact = 0.1714                 # the sole lands on the ball
release = 0.6857                 # the sole lets go, the ball at rest behind his hip line (the move's end tick)
end = 1.0                         # side-on, balanced, ready to go

[[variant]]
suffix = ""
spans = [0.12, 0.36, 0.22]

[ball]
radius = 0.11
on = ["contact", "release"]

# each foot's stances (normalised times)
[stance]
left = [[0, 0.3333], [0.5239, 1]]
right = [[0.8857, 1]]

# The move sheet (data/moves/sheets.json): the ball's legs, the exit rule and how far the left stick may turn its frame.
[sheet]
entry_speed = 0
steer_deg = 0

[[sheet.leg]]
from = "contact"
to = "release"
anchor = "pitch"
foot = "right"
surface = "sole"

[sheet.exit]
kind = "touch"
min_deg = 60
max_deg = 180
push = "jog"

# The card: what the solved clip must measure (tools/anim/clip_measures.py, card_measures).
[card]
pull_m = [0.66, 0.74]              # the ball is pulled back along his run on the pitch
end_behind_m = [0.20, 0.30]       # and ends at rest this far behind his hip line ...
end_side_m = [0.10, 0.18]         # ... and to the playing foot's side
hop_m = [0.20, 0.30]              # he hops back
open_deg = [85, 95]               # and opens toward the playing foot's side: side-on to the ball
drop_m = [0.05, 0.20]             # the sell: he sits into it



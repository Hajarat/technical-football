head = { yaw = 10, pitch = 22 }
foot_l = { pos = [0.34, 0.08, 0.15], yaw = 12, pitch = 8, knee = [0.5, 0.1, 1] }
hand_l = { swing = 0, abduct = 35, bend = 40, trail = 90 }
hand_r = { swing = 30, abduct = 5, bend = 55 }

[[key]]

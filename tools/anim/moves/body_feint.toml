# Body feint from standing, selling his left (side = left, the simulation's left foot): no foot over the ball; the left foot steps
# out and plants hard, the body lunges onto it (pelvis shift, shoulder drop, head and eyes going left), then he pushes off the
# planted left foot to his right, the right foot stepping out right-forward for the exit (the runtime's exit touch takes the ball).
# body_feint_left and its mirror body_feint_right. body_feint_run.toml is the same at 2 m/s. Conventions as in ball_roll.toml.

name = "body_feint"
move = "body_feint"
side = "left"
foot = "left"
entry = "stand"
entry_speed = 0.0
notes = "body feint from standing: hard wide plant and deep lunge to the left, shoulder and hip drop with the right arm across, push off the left foot to the right"

[sim]
feint_s = 0.25                    # body_feint_seconds, ExecuteTick to EndTick; ContactTick halfway (no contact: the plant)
close_in_max_s = 0.15             # as the step-over: closes in first on a ball further than 0.45 m ahead
authored_s = [0.18, 0.17, 0.25]   # start->contact (step out and plant), contact->release (load, push), release->end (away)
ball_start = [0.0, 0.11, 0.30]
ball_radius = 0.11

[events]
start = 0.0
contact = 0.35                    # the left foot planted, the lean at its deepest coming (ContactTick)
release = 0.65                    # the push off the left foot begins to carry him right (EndTick)
end = 1.0

[[variant]]
suffix = ""
spans = [0.18, 0.17, 0.25]

[ball]
radius = 0.11

# The move sheet (data/moves/sheets.json): the ball's legs, the exit rule and how far the left stick may turn its frame.
[sheet]
steer_deg = 45

[[sheet.leg]]
from = "start"
to = "release"
anchor = "free"

[sheet.exit]
kind = "touch"
min_deg = 45
max_deg = 90
push = "sprint"

[[key]]
t = 0.0
ease = 1.0
label = "start: ready stance behind the ball"
pelvis = { pos = [0.0, 0.93, 0.0], pitch = 10 }
chest = { pitch = 6 }
head = { pitch = 22 }
foot_l = { pos = [0.13, 0.002, 0.06], yaw = 8, knee = [0.15, 0, 1] }
foot_r = { pos = [-0.13, 0.002, 0.06], yaw = -8, knee = [-0.15, 0, 1] }
hand_l = { swing = 8, abduct = 14, bend = 40 }
hand_r = { swing = 8, abduct = 14, bend = 40 }
ball = { pos = [0.0, 0.11, 0.30] }

[[key]]
t = 0.15
label = "the left foot steps out, the body starting over"
pelvis = { pos = [0.07, 0.895, 0.04], yaw = 5, pitch = 12, roll = 4 }

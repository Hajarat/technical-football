head = { yaw = 26, pitch = 20, roll = 10 }
foot_l = { pos = [0.50, 0.002, 0.18], yaw = 18, pitch = 0, knee = [0.6, 0, 1], ease = 1 }
foot_r = { pos = [-0.13, 0.002, 0.06], yaw = 0, knee = [-0.1, 0, 1], ease = 1 }

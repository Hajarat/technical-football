# Ball roll: the sole of the right foot rolls the ball across the body to the player's left; author.py writes this side as
# ball_roll_left and mirrors it into ball_roll_right. Entered from standing (or a slow close-control dribble), exits into a run
# to the left-forward.
#
# Units: metres on the 1.80 m model, degrees. Model space: he faces +Z, his left is +X, the ground is y = 0 under the start.
# Frames for a foot's pos: "ground" (the start's ground), "pelvis", "ball" (from the ball's centre, moving with it).
# A foot's pos is its sole point (the boot's sole under mid-foot: the point the game puts on the ball). At rest the sole points
# sit at x = +-0.215, y = 0.002, z = 0.142; the hip joints' midpoint at y = 0.983 with straight legs.
# Angles: yaw turns toward his left, pitch tips forward (a foot's pitch lifts the toes), roll tips the top toward his left.

name = "ball_roll"
move = "ball_roll"
side = "left"           # the ball goes to his left
foot = "right"          # with the sole of his right foot
notes = "hand-authored ball roll: sole of the right foot rolls the ball to his left, support-foot hop, exit to the left-forward"

# What the simulation does (src/FootballSim.Core/SkillMoves.cs, data/tuning/default.json "skill"), authored to here for a player
# starting from standing; copied into clips.json.
[sim]
reach_max_s = 0.1                 # sole_reach_max: the sole lands at most 0.1 s after the move starts (ContactTick - StartTick)
roll_s = 0.3                      # ball_roll_first_seconds (0.2 when chained): ContactTick to EndTick
ball_lateral_m = 0.6              # ball_roll_distance at entry 0 m/s (1.0 m at 4 m/s), eased in and out across the body
ball_forward_m = 0.0              # entry speed x roll time along the run (0 from standing)
player_lateral_m = 0.3            # ball_roll_follow 0.5 x the ball's lateral distance, at a constant sideways speed
ball_start = [-0.09, 0.11, 0.25]  # contact point: 0.25 m ahead (contact_zone_ahead at rest), 0.09 m to the foot's side
ball_radius = 0.11

[events]                          # normalised layout; each variant gives the spans' seconds
start = 0.0
contact = 0.2                     # the sole lands on the ball
release = 0.7                     # the sole leaves it (the simulation's EndTick)
end = 1.0                         # settled into the first running step

[[variant]]                       # the simulation's timing: reach 0.1 s, roll 0.3 s, settle 0.25 s
suffix = ""
spans = [0.1, 0.3, 0.25]

[[variant]]                       # the timing that reads best in the audition: reach 0.15 s, roll 0.45 s, settle 0.25 s
suffix = "_slow"
spans = [0.15, 0.45, 0.25]

[ball]
radius = 0.11
on = ["contact", "release"]       # the playing foot's sole is on the ball over this span

# ------------------------------------------------------------------------------------------------ start: ready stance
[[key]]
t = 0.0
ease = 1.0
label = "start"
pelvis = { pos = [0.0, 0.93, 0.0], pitch = 10 }
chest = { pitch = 6 }
head = { yaw = -8, pitch = 22 }
foot_l = { pos = [0.14, 0.002, 0.10], yaw = 8, knee = [0.15, 0, 1] }
foot_r = { pos = [-0.12, 0.002, 0.02], yaw = -8, knee = [-0.1, 0, 1] }
hand_l = { swing = 8, abduct = 14, bend = 40 }
hand_r = { swing = 8, abduct = 14, bend = 40 }
ball = { pos = [-0.09, 0.11, 0.25] }

# ------------------------------------------------------------------------------------------------ reach
[[key]]
t = 0.11
label = "reach: weight onto the left leg, right knee up, foot over the ball"
pelvis = { pos = [0.04, 0.9, 0.01], yaw = 1, pitch = 12, roll = -2 }
foot_r = { pos = [-0.10, 0.20, 0.14], yaw = -4, pitch = 12, knee = [0, 0.35, 1] }

[[key]]
t = 0.2
label = "contact: sole on top of the ball, toes up"
pelvis = { pos = [0.07, 0.875, 0.02], yaw = 4, pitch = 14, roll = -3 }
chest = { yaw = 10, pitch = 8, roll = -10 }
head = { yaw = -6, pitch = 34 }
foot_l = { pos = [0.14, 0.002, 0.10], yaw = 8, knee = [0.2, 0, 1], ease = 1 }
foot_r = { pos = [0.01, 0.11, 0.0], frame = "ball", yaw = 0, pitch = 12, knee = [0.1, 0.3, 1], ease = 0.3 }
hand_l = { swing = 15, abduct = 45, bend = 30 }
hand_r = { swing = 18, abduct = 8, bend = 45 }
ball = { pos = [-0.09, 0.11, 0.25], ease = 1 }

# ------------------------------------------------------------------------------------------------ roll
[[key]]
t = 0.36
label = "roll: support foot still down"
foot_l = { pos = [0.15, 0.002, 0.09], yaw = 9, ease = 1 }

[[key]]
t = 0.45
label = "mid-roll: right leg sweeping across, hips turning, support foot hops left"
pelvis = { pos = [0.16, 0.865, 0.03], yaw = 14, pitch = 14, roll = -2 }
chest = { yaw = 0, pitch = 8, roll = -8 }
head = { yaw = -2, pitch = 36 }
foot_l = { pos = [0.31, 0.035, 0.05], yaw = 15, pitch = -6, knee = [0.25, 0, 1] }
foot_r = { pos = [0.0, 0.11, 0.0], frame = "ball", yaw = 10, pitch = 12, knee = [0.35, 0.3, 1] }

[[key]]
t = 0.53
label = "support foot lands"
foot_l = { pos = [0.46, 0.002, 0.0], yaw = 20, pitch = 0, knee = [0.3, 0, 1], ease = 1 }

# ------------------------------------------------------------------------------------------------ release and exit
[[key]]
t = 0.7
label = "release: the sole leaves the ball ahead of the left foot's instep"
pelvis = { pos = [0.28, 0.87, 0.04], yaw = 25, pitch = 13, roll = 0 }
chest = { yaw = -4, pitch = 7, roll = -4 }
head = { yaw = 0, pitch = 30 }
foot_l = { pos = [0.46, 0.002, 0.0], yaw = 20, ease = 1 }
foot_r = { pos = [-0.01, 0.11, 0.0], frame = "ball", yaw = 20, pitch = 10, knee = [0.4, 0.2, 1], ease = 0 }
hand_l = { swing = 5, abduct = 50, bend = 35 }
hand_r = { swing = 15, abduct = 10, bend = 55 }
ball = { pos = [0.51, 0.11, 0.25], ease = 1 }

[[key]]
t = 0.77
label = "foot up and back off the ball"
foot_r = { pos = [0.47, 0.20, 0.12], yaw = 24, pitch = 4 }

[[key]]
t = 0.86
label = "right foot lands crossed just past the midline and takes the weight"
pelvis = { pos = [0.36, 0.875, 0.06], yaw = 30 }
foot_r = { pos = [0.38, 0.002, 0.07], yaw = 28, pitch = 0, knee = [0.4, 0, 1], ease = 1 }
foot_l = { pos = [0.46, 0.002, 0.0], yaw = 20, ease = 1 }

[[key]]
t = 1.0
ease = 0.0
label = "end: rising into the first running stride to the left-forward"
pelvis = { pos = [0.44, 0.905, 0.10], yaw = 40, pitch = 12, roll = 0 }
chest = { yaw = 4, pitch = 8, roll = 0 }
head = { yaw = 2, pitch = 10 }
foot_l = { pos = [0.50, 0.05, -0.04], yaw = 30, pitch = -25, toe = 30, knee = [0.4, 0, 1] }
foot_r = { pos = [0.38, 0.002, 0.07], yaw = 28, ease = 1 }
hand_l = { swing = -25, abduct = 14, bend = 85 }
hand_r = { swing = 30, abduct = 6, bend = 85 }
ball = { pos = [0.51, 0.11, 0.25] }

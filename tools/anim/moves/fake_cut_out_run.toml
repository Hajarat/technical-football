# Fake shot at 3 m/s, cut with the outside of the foot (shoot pressed, cancelled within 0.1 s with the stick held toward the shooting foot's
# own side): running in, a full shooting wind-up with the plant foot set wide of the ball, then the right leg comes through on the
# ball's left, the foot turned in, and the OUTSIDE of the foot hooks the ball across to his right (60 degrees off the run); the body
# turns right with it into the exit. The simulation plays a cut toward the shooting foot's own side with the outside of that foot
# (SkillMoves.cs: FakeCut, FootSurface.Outside); toward the other side it is the inside hook of fake_cut.toml. fake_cut_out_right
# (right foot) and its mirror fake_cut_out_left (left foot). The standing version is fake_cut_out.toml (same events). Conventions as in
# ball_roll.toml.

name = "fake_cut_out"
move = "fake_cut"
side = "right"
foot = "right"
entry = "run"
entry_speed = 3.0
notes = "fake shot, cut at 3 m/s: running shooting wind-up, the outside of the right foot hooks the ball 60 deg to his right, body turns into the exit"

[sim]
fake_shot_window_s = 0.1          # the cancel must come within 0.1 s of the shoot press (the shot's own wind-up is 0.45 s)
fake_s = 0.1                      # fake_seconds: the move, from the cancel; the hook is at its first tick (no reach)
cut_distance_m = 1.2              # fake_cut_distance: the push reaches 1.2 m from the player ...
cut_time_s = 0.5                  # ... in fake_cut_time
speed_kept = 0.5                  # FakeCutSpeedKept: the player keeps half his entry speed by the end of the move
surface = "outside: the cut is toward the shooting foot's own side"
authored_s = [0.30, 0.10, 0.28]   # press->contact (wind-up and swing), contact->release (the hook carries), release->end (turn)
cut_deg_right = 60
ball_start = [-0.06, 0.11, 0.50]   # 0.5 m ahead, rolling at 1.7 m/s: he catches it up for the shot
entry_speed = 3.0
ball_radius = 0.11

[events]
start = 0.0                       # shoot pressed
contact = 0.5                     # the outside of the foot meets the ball
release = 0.65                    # it leaves it
end = 1.0

[[variant]]
suffix = "_run"
spans = [0.30, 0.10, 0.28]

[ball]
radius = 0.11
touch = { contact = "right", release = "right" }

# Travel: 3 m/s into the wind-up (pelvis z 0.36 at t 0.2, 0.65 at the plant, 0.85 at the contact), half of it kept by the end.
[[key]]
t = 0.0
ease = 0.0
label = "start: running in, the right foot swinging through to its last plant"
pelvis = { pos = [0.0, 0.92, 0.0], pitch = 13 }
chest = { pitch = 6 }
head = { pitch = 25 }
foot_l = { pos = [0.13, 0.05, -0.20], yaw = 6, pitch = -25, toe = 25, knee = [0.15, 0, 1] }
foot_r = { pos = [-0.13, 0.08, 0.0], yaw = -6, pitch = 0, knee = [-0.15, 0.1, 1] }
hand_l = { swing = 20, abduct = 14, bend = 70 }
hand_r = { swing = -15, abduct = 14, bend = 70 }
ball = { pos = [-0.06, 0.11, 0.50], ease = [1, 1, 0] }

[[key]]
t = 0.12
label = "the right foot plants"
foot_r = { pos = [-0.13, 0.002, 0.30], yaw = -6, pitch = 0, knee = [-0.15, 0, 1], ease = 1 }

[[key]]
t = 0.2
label = "the long last stride: the left foot reaching wide of the ball, arms opening"
pelvis = { pos = [0.05, 0.90, 0.36], yaw = -6, pitch = 13, roll = 2 }
chest = { yaw = 2, pitch = 12 }
foot_l = { pos = [0.22, 0.12, 0.47], yaw = 6, pitch = 10, toe = 0, knee = [0.2, 0.1, 1] }
hand_l = { swing = 20, abduct = 35, bend = 35 }
hand_r = { swing = -15, abduct = 30, bend = 35 }

[[key]]
t = 0.21
label = "the right foot pushes off"
foot_r = { pos = [-0.13, 0.002, 0.30], yaw = -6, pitch = -15, toe = 20, ease = 1 }

[[key]]
t = 0.36
label = "top of the backswing: plant foot a stride wide of the ball, right leg drawn back, arms out, trunk over the ball"
pelvis = { pos = [0.11, 0.875, 0.65], yaw = -15, pitch = 16, roll = 5 }
chest = { yaw = 6, pitch = 16, roll = -2 }
head = { yaw = -4, pitch = 38 }
foot_l = { pos = [0.28, 0.002, 0.78], yaw = 6, pitch = 0, knee = [0.2, 0, 1], ease = 1 }
foot_r = { pos = [-0.04, 0.30, 0.42], yaw = -6, pitch = -45, toe = 0, knee = [0, -0.6, 1] }
hand_l = { swing = 30, abduct = 55, bend = 30, trail = 90 }
hand_r = { swing = -30, abduct = 40, bend = 30, trail = 90 }

[[key]]

# Elastico from standing, exit to his left (S = left: the RIGHT foot plays): after a 0.10 s reach the OUTSIDE of the right foot carries
# the ball about 0.30 m to his right, the foot wraps round the back of the ball (toes a few cm off it) without losing it, and the INSIDE snaps it
# back across toward the left so it runs on at 45 degrees off the run, ending 0.55 m to the left of where it started. The upper
# body sells the first direction (hip and shoulder drop to the right), then drives off the left foot toward the exit. Not in the
# simulation yet (the gesture is recognised and ignored): authored to the numbers it will be built to. elastico_left and its
# mirror elastico_right (elastico_run.toml is the same at 2 m/s). Conventions as in ball_roll.toml.

name = "elastico"
move = "elastico"
side = "left"
foot = "right"
entry = "stand"
entry_speed = 0.0
notes = "elastico from standing: outside push 0.30 m away from the exit, the foot wraps round the ball, inside snaps it back 45 deg toward the exit"

[sim]
status = "not built: authored to the numbers it will be built to"
reach_s = 0.10
move_s = 0.40
push_m = 0.30                     # the outside carries the ball this far away from S ...
push_s = 0.16                     # ... over the first 0.16 s (authored 0.11, so the foot has 0.11 s to wrap round)
contact2_s = 0.20                 # the inside snap, from the move's start (authored 0.22)
end_offset_m = 0.55               # the ball ends this far to the S side of where it started, moving on at 45 deg off the run
max_forward_mps = 2.0
entry_speed = 0.0
ball_start = [-0.08, 0.11, 0.32]
ball_radius = 0.11

[events]
start = 0.0
contact = 0.2                     # the outside meets the ball
contact2 = 0.64                   # the inside snaps it back
release = 0.72                    # the inside leaves it
end = 1.0

[[variant]]
suffix = ""
spans = [0.10, 0.22, 0.04, 0.14]

[ball]
radius = 0.11
touch = { contact = "right", contact2 = "right", release = "right" }

[[key]]
t = 0.0
ease = 1
label = "start: ready stance, the ball at the right foot"
pelvis = { pos = [0.0, 0.93, 0.0], pitch = 10 }
chest = { pitch = 6 }
head = { pitch = 26 }
foot_l = { pos = [0.15, 0.002, 0.08], yaw = 8, knee = [0.15, 0, 1] }
foot_r = { pos = [-0.13, 0.002, 0.04], yaw = -6, knee = [-0.15, 0, 1] }
hand_l = { swing = 8, abduct = 14, bend = 40 }
hand_r = { swing = 8, abduct = 14, bend = 40 }
ball = { pos = [-0.08, 0.11, 0.32], ease = 0 }

[[key]]
t = 0.1
label = "reach: the right foot crosses in front to the ball's left side"
foot_r = { pos = [0.04, 0.05, 0.1], yaw = 0, pitch = 0, toe = 0, knee = [0.2, 0.2, 1] }

[[key]]
t = 0.2
label = "contact: the outside of the right foot on the ball's left side; the sell begins (hip and shoulder drop away from the exit)"
pelvis = { pos = [-0.03, 0.87, 0.04], yaw = -14, pitch = 12, roll = -8 }
chest = { yaw = -12, pitch = 12, roll = -20 }
head = { yaw = -18, pitch = 32, roll = -6 }
foot_l = { pos = [0.15, 0.002, 0.08], yaw = 8, pitch = 0, toe = 0, knee = [0.2, 0, 1], ease = 1 }
foot_r = { pos = [0.145, -0.09, 0.0], frame = "ball", yaw = 0, pitch = 0, knee = [0.0, 0.1, 1], ease = 0 }
hand_l = { swing = 35, abduct = 0, bend = 60 }
hand_r = { swing = -10, abduct = 62, bend = 30, trail = 100 }
ball = { pos = [-0.08, 0.11, 0.32], ease = 1 }

[[key]]
t = 0.42
label = "the outside has carried the ball 0.30 m away from the exit; the sell at its deepest"
pelvis = { pos = [-0.14, 0.845, 0.07], yaw = -20, pitch = 13, roll = -12 }
chest = { yaw = -14, pitch = 12, roll = -28 }
head = { yaw = -22, pitch = 32, roll = -8 }
foot_r = { pos = [0.145, -0.09, 0.0], frame = "ball", yaw = -12, pitch = 0, knee = [-0.35, 0.15, 1] }
hand_l = { swing = 45, abduct = -8, bend = 65 }
hand_r = { swing = -15, abduct = 75, bend = 25, trail = 100 }
ball = { pos = [-0.38, 0.11, 0.33], ease = [0, 1, 0] }

[[key]]
t = 0.51
label = "the foot wraps round the back of the ball, its toes a few centimetres off it"
foot_r = { pos = [0.05, -0.08, -0.23], frame = "ball", yaw = -22, pitch = 5, knee = [0, 0.2, 1] }

[[key]]
t = 0.58
label = "and up its right side"
foot_r = { pos = [-0.11, -0.08, -0.19], frame = "ball", yaw = -35, pitch = 3 }

[[key]]

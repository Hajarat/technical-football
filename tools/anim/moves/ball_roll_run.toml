head = { yaw = 0, pitch = 28 }
foot_l = { pos = [0.86, 0.002, 1.60], yaw = 15, ease = 1 }
foot_r = { pos = [-0.01, 0.11, 0.0], frame = "ball", yaw = 6, pitch = 10, knee = [0.3, 0.2, 1], ease = 0 }
hand_l = { swing = -5, abduct = 35, bend = 45, trail = 80 }
hand_r = { swing = 22, abduct = 16, bend = 60 }
ball = { pos = [0.81, 0.11, 2.16] }

[[key]]

foot_r = { pos = [0.0, 0.11, 0.0], frame = "ball", yaw = 10, pitch = 11, knee = [0.3, 0.25, 1] }
ball = { pos = [0.75, 0.11, 1.77] }

[[key]]
t = 0.61
label = "the left foot lands out to the left, just behind the ball's path"
foot_l = { pos = [0.86, 0.002, 1.60], yaw = 15, pitch = 0, knee = [0.3, 0, 1], ease = 1 }


label = "the left foot leaves the ground"
foot_l = { pos = [0.14, 0.03, 0.30], yaw = 6, pitch = -30, toe = 20, knee = [0.25, 0, 1] }

[[key]]
t = 0.325
label = "the sole drags the ball across, the left foot in the air hopping to the left"

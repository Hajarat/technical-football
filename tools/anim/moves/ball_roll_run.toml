foot_l = { pos = [0.36, 0.12, 0.72], yaw = 8, pitch = -5, toe = 0, knee = [0.3, 0.1, 1] }
foot_r = { pos = [0.0, 0.11, 0.0], frame = "ball", yaw = 4, pitch = 12, knee = [0.0, 0.3, 1] }
ball = { pos = [0.29, 0.11, 1.24] }

[[key]]

# Ball roll entered at a run (3.9 m/s): the same move as ball_roll.toml (same events at the same normalised times, comparable
# poses, so the runtime can blend the two by entry speed), drawn on the simulation's run version: the right sole lands on the
# ball 0.57 m ahead and rolls it about 0.85 m to his left while he keeps running (85% of his pace) and steps with it, facing
# along the run. The support (left) foot skips under the travelling body: short stances with the foot fixed on the pitch
# (flagged in [stance], so the runtime holds it where it landed), each under about 0.4 m of his travel, and two small hops
# between them with the pelvis rising off the ground and settling on each landing. Two endings: this file's own, for an exit
# touch made by the rolling foot (the left foot lands a third time under his left hip and stands there through the touch while
# the right comes off the ball into it, then steps down), and the ending "_swap", for an exit touch made by the support foot
# (the left foot leaves the ground at the second hop's take-off and swings into the touch; the rolling foot comes off the ball
# down onto the pitch as the new support). The runtime picks the ending from the exit touch the core forecasts. Clips
# ball_roll_left_run, ball_roll_right_run, ball_roll_left_run_swap, ball_roll_right_run_swap. Conventions as in ball_roll.toml.
#
# Laid out on the play-test roll (round 20261120-112450, entry 3.88 m/s): every position is the simulation's (his place, the
# ball's) less where the clip's root is then. The runtime puts the pose relative to a root that runs straight from the first
# frame's hips to the last frame's (SkillClip.Root) onto his simulated position, so the hips run straight here and the feet and
# the ball are set against them as they are against him in the simulation. The clip's 0.40 s roll span is played over the
# simulation's 0.30 s (the shared time map), so the keys are placed at the simulation's times mapped onto the spans: in the
# roll, normalised t = 0.2 + 1.667 x (seconds after the sole's landing); a stance of 0.1 normalised lasts 0.06 s of play.
# A foot's pos is its sole point, about 0.15 m ahead of the ankle: a foot under the hips has its sole point 0.15 m ahead of them.
# The ball runs about 0.4 m ahead of the hips, so the support foot stands behind it or beside its path, never in it.

name = "ball_roll"
move = "ball_roll"
side = "left"
foot = "right"
entry = "run"
entry_speed = 3.5
notes = "ball roll at a run: right sole rolls the ball about 0.85 m to his left while he runs on at 85% of his pace and steps 0.5 m with it, the left foot skipping under him in two small hops, facing along the run; the left foot stands under him for the right foot's exit touch"

[sim]
reach_s = 0.12
roll_s = 0.30                     # ball_roll_run_seconds (0.40 from standing, blended by entry speed between 1 and 2.5 m/s)
entry_speed = 3.9
ball_lateral_m = 0.85             # from the sole's landing to the release (ball_roll_distance 1.0 m at 4 m/s, less his reach's step)
player_lateral_m = 0.51           # his step with the ball over the roll; the ball ends 0.45 m ahead of him along his travel
player_forward_m = 1.13           # over the roll (run held through the reach, then eased at 6 m/s^2 to 85% of the entry pace)
ball_start = [-0.07, 0.11, 0.57]  # against him at the sole's landing
ball_radius = 0.11

[events]
start = 0.0
contact = 0.2
release = 0.7
end = 1.0

[[variant]]
suffix = "_run"
spans = [0.12, 0.40, 0.25]

[ball]
radius = 0.11
on = ["contact", "release"]

# the support foot's three stances, then the rolling foot's step down after the exit touch (normalised times)
[stance]
left = [[0.0, 0.13889], [0.34166, 0.44584], [0.57083, 0.69584]]
right = [[0.81599, 0.91601]]

# ------------------------------------------------------------------------------------------------ start: mid-stride
# The move sheet (data/moves/sheets.json): the ball's legs, the exit rule and how far the left stick may turn its frame.
[sheet]
entry_speed = 3.38             # the pace the root comes in at, m/s
steer_deg = 0

[[sheet.leg]]
from = "contact"
to = "release"
anchor = "body"
foot = "right"
surface = "sole"

[sheet.exit]
kind = "touch"
min_deg = 0
max_deg = 60
push = "jog"
foot = "left"
surface = "inside"


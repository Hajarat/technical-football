# Ball roll entered at a run (3.9 m/s): the same move as ball_roll.toml (same events at the same normalised times, comparable
# poses, so the runtime can blend the two by entry speed), drawn on the simulation's run version: the right sole lands on the
# ball 0.57 m ahead and rolls it about 0.85 m to his left while he keeps running (85% of his pace) and steps with it; the
# support foot takes one quick side hop to the left under the body, he keeps facing along the run, and the right foot comes
# off the ball straight into the next running stride. Clips ball_roll_left_run, ball_roll_right_run. Conventions as in
# ball_roll.toml.
#
# Laid out on the play-test roll (round 20261120-112450, entry 3.88 m/s): every position is the simulation's (his place, the
# ball's, a planted foot's) less where the clip's root is then. The runtime puts the pose relative to a root that runs straight
# from the first frame's hips to the last frame's (SkillClip.Root) onto his simulated position, so the hips run straight here and
# the feet and the ball are set against them as they are against him in the simulation. The clip's 0.40 s roll span is played
# over the simulation's 0.30 s (the shared time map), so the keys are placed at the simulation's times mapped onto the spans.

name = "ball_roll"
move = "ball_roll"
side = "left"
foot = "right"
entry = "run"
entry_speed = 3.5
notes = "ball roll at a run: right sole rolls the ball about 0.85 m to his left while he runs on at 85% of his pace and steps 0.5 m with it, support-foot side hop, facing along the run"

[sim]
reach_s = 0.12
roll_s = 0.30                     # ball_roll_run_seconds (0.40 from standing, blended by entry speed between 1 and 2.5 m/s)
entry_speed = 3.9
ball_lateral_m = 0.85             # from the sole's landing to the release (ball_roll_distance 1.0 m at 4 m/s, less his reach's step)
player_lateral_m = 0.51           # his step with the ball over the roll; the ball ends 0.45 m ahead of him along his travel
player_forward_m = 1.13           # over the roll (run held through the reach, then eased at 6 m/s^2 to 85% of the entry pace)
ball_start = [-0.07, 0.11, 0.57]  # against him at the sole's landing
ball_radius = 0.11

[events]
start = 0.0
contact = 0.2
release = 0.7
end = 1.0

[[variant]]
suffix = "_run"
spans = [0.12, 0.40, 0.25]

[ball]
radius = 0.11
on = ["contact", "release"]

# ------------------------------------------------------------------------------------------------ start: mid-stride
[[key]]
t = 0.0
ease = 0.0
label = "start: running, left foot just landed ahead of the body, right foot leaving the ground behind"
pelvis = { pos = [0.0, 0.92, 0.0], pitch = 13 }
chest = { pitch = 6 }
head = { yaw = -6, pitch = 22 }
foot_l = { pos = [0.12, 0.002, 0.22], yaw = 4, knee = [0.15, 0, 1], ease = 1 }
foot_r = { pos = [-0.12, 0.08, -0.04], yaw = -4, pitch = -20, toe = 15, knee = [-0.1, 0, 1] }
hand_l = { swing = -20, abduct = 14, bend = 75 }
hand_r = { swing = 25, abduct = 14, bend = 75 }
ball = { pos = [-0.03, 0.11, 0.71] }

# ------------------------------------------------------------------------------------------------ reach
[[key]]
t = 0.1
label = "reach: the right knee drives forward, the foot rising over the rolling ball"
pelvis = { pos = [0.06, 0.905, 0.20], yaw = 1, pitch = 14, roll = -2 }
foot_r = { pos = [-0.09, 0.27, 0.42], yaw = -6, pitch = 14, toe = 0, knee = [-0.4, 0.3, 1] }
ball = { pos = [0.01, 0.11, 0.84] }

[[key]]
t = 0.2
label = "contact: the right sole on top of the ball out in front, the left foot pushing off behind"
pelvis = { pos = [0.12, 0.89, 0.41], yaw = 3, pitch = 15, roll = -3 }
chest = { yaw = 6, pitch = 8, roll = -8 }
head = { yaw = -6, pitch = 32 }
foot_l = { pos = [0.12, 0.012, 0.22], yaw = 4, pitch = -15, toe = 20, knee = [0.2, 0, 1], ease = 1 }
foot_r = { pos = [0.01, 0.11, 0.0], frame = "ball", yaw = -4, pitch = 12, knee = [-0.3, 0.3, 1], ease = 0.3 }
hand_l = { swing = 5, abduct = 40, bend = 40, trail = 90 }
hand_r = { swing = 25, abduct = 20, bend = 50 }
ball = { pos = [0.05, 0.11, 0.98] }

# ------------------------------------------------------------------------------------------------ roll: a side hop with the ball

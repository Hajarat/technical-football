# Drag-back braking from a sprint (7.6 m/s): as drag_back_run.toml, braking at up to 30 m/s^2, so the stop takes a step: the left
# foot plants ahead of him, lets go as his hips pass over it, skips forward and plants again; his run is gone 0.29 s into the move,
# 1.16 m on, he hops the left foot back 0.28 m and opens his hips a quarter turn toward the playing foot while the sole, which
# stopped the ball dead as it landed, pulls it 0.76 m straight back along his run to rest 0.23 m behind his hip line. Same events
# at the same normalised times as drag_back.toml. Clips drag_back_right_sprint, drag_back_left_sprint.
#
# Written in the ground frame (see drag_back_run.toml): his real travel, 1.16 m forward to the stop, then back.

name = "drag_back"
move = "drag_back"
side = "none"
foot = "right"
entry = "sprint"
entry_speed = 7.6
max_bone_deg_s = 2500              # exaggerated foot work, read from the game camera (the default is 1,500)
notes = "drag-back braking from a sprint: two braking plants, the sole stops the ball and pulls it 0.76 m back to rest behind his hip line while he hops back and opens a quarter turn, ending side-on to it"

[events]
start = 0.0
contact = 0.1714                 # the sole lands on the ball
release = 0.6857                 # the sole lets go, the ball at rest behind his hip line (the move's end tick)
end = 1.0                         # side-on, balanced, ready to go

[[variant]]
suffix = "_sprint"
spans = [0.12, 0.36, 0.22]

[ball]
radius = 0.11
on = ["contact", "release"]

# each foot's stances (normalised times)
[stance]
left = [[0.0476, 0.1429], [0.2381, 0.3571], [0.5239, 1]]
right = [[0.8857, 1]]

# The move sheet (data/moves/sheets.json): the ball's legs, the exit rule and how far the left stick may turn its frame.
[sheet]
entry_speed = 7.6
steer_deg = 0
plant = [[0.0, 0.6857]]             # the braking plants and the hop back ...
plant_accel = 30                  # ... where he stops harder than a plant's 20 m/s^2, at most 30: from a sprint he brakes over a step (the left foot plants twice)

[[sheet.leg]]
from = "contact"
to = "release"
anchor = "pitch"
foot = "right"
surface = "sole"

[sheet.exit]
kind = "touch"
min_deg = 60
max_deg = 180
push = "jog"

# The card: what the solved clip must measure (tools/anim/clip_measures.py, card_measures).
[card]
pull_m = [0.70, 0.82]              # the ball is pulled back along his run on the pitch
end_behind_m = [0.20, 0.30]       # and ends at rest this far behind his hip line ...
end_side_m = [0.10, 0.18]         # ... and to the playing foot's side
hop_m = [0.20, 0.30]              # he hops back
open_deg = [85, 95]               # and opens toward the playing foot's side: side-on to the ball
drop_m = [0.05, 0.20]             # the sell: he sits into it
stop_share = [0.0, 0.62]          # his pace along the run is gone by this share of the move (he brakes over a step)



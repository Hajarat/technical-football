# Drag-back braking from a sprint (7.6 m/s): as drag_back_run.toml with a harder braking plant further ahead of him; his run is
# gone 0.18 s into the move, he hops the left foot back 0.30 m and opens his hips a quarter turn toward the playing foot while the
# sole pulls the ball 1.10 m straight back along his run to rest 0.25 m behind his hip line. Same events at the same normalised
# times as drag_back.toml. Clips drag_back_right_sprint, drag_back_left_sprint.
#
# Written in the ground frame (see drag_back_run.toml): his real travel, 0.80 m forward to the stop, then back.

name = "drag_back"
move = "drag_back"
side = "none"
foot = "right"
entry = "sprint"
entry_speed = 7.6
notes = "drag-back braking from a sprint: a harder braking plant, the sole stops the ball and pulls it 1.10 m back to rest behind his hip line while he hops back and opens a quarter turn, ending side-on to it"

[events]
start = 0.0
contact = 0.1714                 # the sole lands on the ball
release = 0.6857                 # the sole lets go, the ball at rest behind his hip line (the move's end tick)
end = 1.0                         # side-on, balanced, ready to go

[[variant]]
suffix = "_sprint"
spans = [0.12, 0.36, 0.22]

[ball]
radius = 0.11
on = ["contact", "release"]

# each foot's stances (normalised times)
[stance]
left = [[0.0476, 0.3333], [0.5239, 1]]
right = [[0.8857, 1]]

# The move sheet (data/moves/sheets.json): the ball's legs, the exit rule and how far the left stick may turn its frame.
[sheet]
entry_speed = 7.6
steer_deg = 0
plant = [[0.0, 0.6571]]             # the braking plant and the hop back ...
plant_accel = 47                  # ... where he stops harder than a plant's 20 m/s^2 (the card's stop needs it; today's drag-back stops harder still)

[[sheet.leg]]
from = "contact"
to = "release"
anchor = "pitch"
foot = "right"
surface = "sole"

[sheet.exit]
kind = "touch"
min_deg = 60
max_deg = 180
push = "jog"

# The card: what the solved clip must measure (tools/anim/clip_measures.py, card_measures).
[card]
pull_m = [1.06, 1.14]              # the ball is pulled back along his run on the pitch
end_behind_m = [0.20, 0.30]       # and ends at rest this far behind his hip line ...
end_side_m = [0.10, 0.18]         # ... and to the playing foot's side
hop_m = [0.20, 0.30]              # he hops back
open_deg = [85, 95]               # and opens toward the playing foot's side: side-on to the ball
drop_m = [0.05, 0.20]             # the sell: he sits into it
stop_share = [0.0, 0.45]          # his pace along the run is gone by this share of the move



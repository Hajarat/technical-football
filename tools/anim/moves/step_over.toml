chest = { yaw = 12, pitch = 16, roll = 30 }
head = { yaw = 26, pitch = 22, roll = 12 }
foot_l = { pos = [0.42, 0.002, 0.30], yaw = 28, pitch = 0, knee = [0.6, 0, 1], ease = 1 }
foot_r = { pos = [-0.13, 0.002, 0.06], yaw = 6, ease = 1 }

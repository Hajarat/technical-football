chest = { yaw = 10, pitch = 12, roll = 16 }
head = { yaw = 14, pitch = 30, roll = 4 }
foot_l = { pos = [0.04, 0.33, 0.56], yaw = 20, pitch = 0, knee = [0.3, 0.5, 1] }
foot_r = { pos = [-0.13, 0.002, 0.06], yaw = -2, knee = [-0.1, 0, 1], ease = 1 }
hand_l = { swing = -5, abduct = 50, bend = 35, trail = 90 }
hand_r = { swing = 45, abduct = -10, bend = 60 }

[[key]]
t = 0.48
label = "round the outside"
foot_l = { pos = [0.32, 0.18, 0.46], yaw = 28, pitch = 0, knee = [0.6, 0.2, 1] }

[[key]]

# Fake shot, stop (shoot pressed, cancelled within 0.1 s with the stick at rest): from standing, a full shooting wind-up (the left
# foot steps in beside the ball, the right leg drawn back, arms out, trunk over the ball), then the right leg comes through short,
# the sole lands on the ball and stops it under the body, and he ends balanced over it. The simulation has no side for it: the
# foot is the shooting foot, so the clips are named by the foot: fake_stop_right and its mirror fake_stop_left.
# fake_stop_run.toml is the same at 3 m/s. Conventions as in ball_roll.toml.

name = "fake_stop"
move = "fake_stop"
side = "none"
foot = "right"
entry = "stand"
entry_speed = 0.0
notes = "fake shot, stop: shooting wind-up, the leg comes through short, the sole stops the ball under him, balanced over it"

[sim]
fake_shot_window_s = 0.1          # the cancel must come within 0.1 s of the shoot press (the shot's own wind-up is 0.45 s)
fake_s = 0.1                      # fake_seconds: the move, from the cancel, after a sole reach of up to 0.12 s
stop_ahead_m = 0.25               # fake_stop_ahead: the ball comes to rest this far ahead of where he stops (his run dies over the move)
surface = "sole"
authored_s = [0.30, 0.15, 0.25]   # press->contact (wind-up, short swing), contact->release (sole stops the ball), release->end
ball_start = [-0.04, 0.11, 0.42]

[events]
start = 0.0                       # shoot pressed
contact = 0.5                     # the sole lands on the ball
release = 0.65                    # the sole lets go, the ball at rest
end = 1.0

[[variant]]
suffix = ""
spans = [0.30, 0.15, 0.25]

[ball]
radius = 0.11
on = ["contact", "release"]

# The move sheet (data/moves/sheets.json): the ball's legs, the exit rule and how far the left stick may turn its frame.
[sheet]
steer_deg = 0

[[sheet.leg]]
from = "contact"
to = "release"
anchor = "pitch"
foot = "right"
surface = "sole"

[sheet.exit]
kind = "rest"

[[key]]
t = 0.0
ease = 1.0
label = "start: ready stance, the ball a step ahead"
pelvis = { pos = [0.0, 0.93, 0.0], pitch = 8 }
chest = { pitch = 6 }
head = { pitch = 25 }
foot_l = { pos = [0.13, 0.002, 0.06], yaw = 6, knee = [0.15, 0, 1] }
foot_r = { pos = [-0.13, 0.002, 0.06], yaw = -6, knee = [-0.15, 0, 1] }
hand_l = { swing = 8, abduct = 14, bend = 40 }
hand_r = { swing = 8, abduct = 14, bend = 40 }
ball = { pos = [-0.04, 0.11, 0.42] }

[[key]]

# Fake shot, cut at 3 m/s (shoot pressed, cancelled within 0.1 s with the stick held): running, a full shooting wind-up (the left
# foot steps in beside the ball, the right leg drawn back, arms out, trunk over the ball), then the right leg comes through and
# the INSIDE of the foot hooks the ball across toward the held direction (here 60 degrees to his left of the run) and the body
# turns with it into the exit. The simulation plays the cut with the shooting foot (StrikeFoot): toward the foot's own side it
# would be the outside of the foot (not authored). fake_cut_left (right foot) and its mirror fake_cut_right (left foot).
# fake_cut.toml is the same from standing (same events). Conventions as in ball_roll.toml.

name = "fake_cut"
move = "fake_cut"
side = "left"
foot = "right"
entry = "run"
entry_speed = 3.0
notes = "fake shot, cut at 3 m/s: running shooting wind-up, the inside of the right foot hooks the ball 60 deg to his left, body turns into the exit"

[sim]
fake_shot_window_s = 0.1          # the cancel must come within 0.1 s of the shoot press (the shot's own wind-up is 0.45 s)
fake_s = 0.1                      # fake_seconds: the move, from the cancel; the hook is at its first tick (no reach)
cut_distance_m = 1.2              # fake_cut_distance: the push reaches 1.2 m from the player ...
cut_time_s = 0.5                  # ... in fake_cut_time
speed_kept = 0.5                  # FakeCutSpeedKept: the player keeps half his entry speed by the end of the move
surface = "inside, or outside toward the foot's own side"
authored_s = [0.30, 0.10, 0.28]   # press->contact (wind-up and swing), contact->release (the hook carries), release->end (turn)
cut_deg_left = 60
ball_start = [-0.04, 0.11, 0.50]   # 0.5 m ahead, rolling at 1.7 m/s: he catches it up for the shot
entry_speed = 3.0
ball_radius = 0.11

[events]
start = 0.0                       # shoot pressed
contact = 0.5                     # the inside of the foot meets the ball
release = 0.65                    # it leaves it
end = 1.0

[[variant]]
suffix = "_run"
spans = [0.30, 0.10, 0.28]

[ball]
radius = 0.11
touch = { contact = "right", release = "right" }

# Travel: 3 m/s into the wind-up (pelvis z 0.36 at t 0.2, 0.65 at the plant, 0.85 at the contact), half of it kept by the end.

[[key]]
t = 0.0
ease = 0.0
label = "start: running in, the right foot swinging through to its last plant"
pelvis = { pos = [0.0, 0.92, 0.0], pitch = 13 }
chest = { pitch = 6 }
head = { pitch = 25 }
foot_l = { pos = [0.13, 0.05, -0.20], yaw = 6, pitch = -25, toe = 25, knee = [0.15, 0, 1] }
foot_r = { pos = [-0.13, 0.08, 0.0], yaw = -6, pitch = 0, knee = [-0.15, 0.1, 1] }
hand_l = { swing = 20, abduct = 14, bend = 70 }
hand_r = { swing = -15, abduct = 14, bend = 70 }
ball = { pos = [-0.04, 0.11, 0.50], ease = [1, 1, 0] }

[[key]]

# Spin (a 360 roulette) toward his left (S = left: the RIGHT sole starts) from standing: after a 0.12 s reach the right sole lands on the
# ball and drags it back and round while he turns 180 degrees to his left on the left foot; the feet swap, the left sole takes
# the ball and drags it on round while he completes the turn on the right foot, facing his original way at the release with the
# ball ahead of him, displaced toward the left and forward. The ball stays within 0.35 m of the hips: he shields it the whole way.
# Not in the simulation yet: authored to the numbers it will be built to. The pelvis yaw is keyed through the full 360 (the
# channel is a plain number, so it never wraps); spin_left and its mirror spin_right (spin_run.toml is the same entered at 2 m/s). Conventions as in ball_roll.toml.

name = "spin"
move = "spin"
side = "left"
foot = "right"
entry = "stand"
entry_speed = 0.0
notes = "spin from standing: right sole drags the ball round through 180 deg, feet swap, left sole completes the 360"

[sim]
status = "not built: authored to the numbers it will be built to"
reach_s = 0.12
move_s = 0.60
contact2_s = 0.30                 # the feet swap, from the move's start
turn_deg = 360
displacement_s_m = 0.5            # toward S, from where the ball was first taken ...
displacement_forward_m = 1.0      # ... and forward (authored 0.8 at the release, 1.15 by the end: see notes in the report)
ball_max_from_hips_m = 0.35
max_forward_mps = 2.0
entry_speed = 0.0
ball_start = [-0.09, 0.11, 0.25]
ball_radius = 0.11

[events]
start = 0.0
contact = 0.14                    # the right sole lands on the ball
lift = 0.44                       # it leaves it, turned 180 degrees
contact2 = 0.48                   # the left sole takes it
release = 0.8                     # the left sole leaves it, turned 360 degrees
end = 1.0

[[variant]]
suffix = ""
spans = [0.12, 0.27, 0.03, 0.30, 0.20]

[ball]
radius = 0.11
on = [["contact", "lift", "right"], ["contact2", "release", "left"]]

# The move sheet (data/moves/sheets.json): the ball's legs, the exit rule and how far the left stick may turn its frame.
[sheet]
steer_deg = 0

[[sheet.leg]]
from = "contact"
to = "contact2"
anchor = "pitch"
foot = "right"
surface = "sole"

[[sheet.leg]]
from = "contact2"
to = "release"
anchor = "facing"
foot = "left"
surface = "sole"

[sheet.exit]
kind = "touch"
min_deg = -30
max_deg = 30
push = "jog"

[[key]]
t = 0.0
ease = 1
label = "start: ready stance, the ball ahead of the right foot"
pelvis = { pos = [0.0, 0.93, 0.0], pitch = 10 }
chest = { pitch = 6 }
head = { pitch = 28 }
foot_l = { pos = [0.14, 0.002, 0.08], yaw = 6, knee = [0.15, 0, 1] }
foot_r = { pos = [-0.13, 0.002, 0.04], yaw = -6, knee = [-0.15, 0, 1] }
hand_l = { swing = 8, abduct = 14, bend = 40 }
hand_r = { swing = 8, abduct = 14, bend = 40 }
ball = { pos = [-0.09, 0.11, 0.25], ease = 0 }

[[key]]
t = 0.08
label = "reach: the right knee lifts, the foot rising over the ball"
pelvis = { pos = [0.03, 0.9, 0.01], pitch = 12, roll = -2 }
foot_r = { pos = [-0.11, 0.24, 0.05], yaw = -6, pitch = 14, toe = 0, knee = [-0.3, 0.3, 1] }

[[key]]
t = 0.14
label = "contact: the right sole on top of the ball; the turn to the left begins on the left foot"
pelvis = { pos = [0.02, 0.865, 0.02], yaw = 0, pitch = 14, roll = 0 }
chest = { yaw = 16, pitch = 12 }
head = { yaw = 10, pitch = 38 }
foot_l = { pos = [0.24, 0.002, 0.3], yaw = 6, pitch = 0, toe = 0, knee = [0.2, 0, 1], ease = 1 }
foot_r = { pos = [0.0, 0.11, 0.0], frame = "ball", yaw = 0, pitch = 12, knee = [-0.2, 0.3, 1], ease = 0.3 }
hand_l = { swing = 5, abduct = 62, bend = 25, trail = 90 }
hand_r = { swing = 15, abduct = 62, bend = 25, trail = 90 }
ball = { pos = [-0.09, 0.11, 0.25], ease = 1 }

[[key]]
t = 0.22
label = "the left foot up on its ball, pivoting"
foot_l = { pos = [0.24, 0.02, 0.3], yaw = 30, pitch = -12, toe = 15, ease = 0 }

[[key]]
t = 0.3
label = "a quarter turn: the sole drags the ball back and round, shoulders and head leading"
pelvis = { pos = [0.07, 0.835, 0.28], yaw = 85, pitch = 15, roll = 2 }
chest = { yaw = 34, pitch = 14 }
head = { yaw = 34, pitch = 34 }
foot_l = { pos = [0.26, 0.02, 0.32], yaw = 90, pitch = -12, toe = 15 }
foot_r = { pos = [0.0, 0.11, 0.0], frame = "ball", yaw = 80, pitch = 12, knee = [0, 0.3, 1] }
hand_l = { swing = -10, abduct = 78, bend = 22, trail = 100 }
hand_r = { swing = 20, abduct = 72, bend = 22, trail = 100 }

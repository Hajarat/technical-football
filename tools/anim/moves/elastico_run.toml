# Elastico entered at a run (5.3 m/s), exit to his left (S = left: the RIGHT foot plays): the same move as elastico.toml (same
# events at the same normalised times). He keeps about 0.9 of his pace through it. After a 0.10 s reach the OUTSIDE of the right
# foot carries the ball 0.50 m to his right over 0.11 s, his hips going 0.19 m with it; the foot stays on the ball, wraps round
# the back of it, and 0.22 s after the contact the INSIDE whips it back across him toward the left as the exit. The support (left)
# foot skips under the travelling body in short stances fixed on the pitch (flagged in [stance], so the runtime holds it where it
# landed), plants for the snap, and he drives off it toward the exit at 2 m/s or more; the right foot comes down off the ball
# across toward the exit as the new support and the left swings through. Clips elastico_left_run and its mirror
# elastico_right_run. Conventions as in ball_roll.toml.
#
# Written in the ground frame: every position is where he and the ball are on the pitch from under his hips at the start, his
# real travel. The pelvis keys every 1/30 s are his path (the sheet's root is their low-pass); the ball's keys from the contact
# to contact2 are its place against him (the sheet's body leg), after contact2 a reference only (the simulation launches it by
# the exit rule).

name = "elastico"
move = "elastico"
side = "left"
foot = "right"
entry = "run"
entry_speed = 5.3
max_bone_deg_s = 2500              # exaggerated foot work, read from the game camera (the default is 1,500)
notes = "elastico at a run: outside push 0.50 m away from the exit with the hips following 0.19 m, the foot wraps round the ball, the inside whips it back across as the exit; the left foot skips under him and plants for the snap, he drives off it after the ball"

[events]
start = 0.0
contact = 0.1667                 # the outside meets the ball
contact2 = 0.5333                # the inside snaps it back (the exit)
release = 0.6                 # the move's end tick
end = 1.0

[[variant]]
suffix = "_run"
spans = [0.10, 0.22, 0.04, 0.24]

[ball]
radius = 0.11
touch = { contact = "right", contact2 = "right" }

# each foot's stances (normalised times)
[stance]
left = [[0, 0.1112], [0.3055, 0.3888], [0.5, 0.6388], [0.9445, 1]]
right = [[0.7778, 0.8612]]

# The move sheet (data/moves/sheets.json): the ball's legs, the exit rule and how far the left stick may turn its frame.
[sheet]
entry_speed = 5.3
steer_deg = 0
plant = [[0.275, 0.7333]]           # the plant for the snap ...
plant_accel = 23                  # ... where the root turns back toward the exit harder than a plant's 20 m/s^2 (the card's 2 m/s by the release needs it)

[[sheet.leg]]
from = "contact"
to = "contact2"
anchor = "body"
foot = "right"
surface = "outside"

[[sheet.leg]]
from = "contact2"
to = "release"
anchor = "launch"
foot = "right"
surface = "inside"

[sheet.exit]
kind = "launch"
min_deg = 45
max_deg = 80
rest_deg = 60
push = "jog"
foot = "right"
surface = "inside"

# The card: what the solved clip must measure (tools/anim/clip_measures.py, card_measures).
[card]
out_m = [0.45, 0.55]              # the ball goes this far away from the exit side against him ...
out_s = [0.08, 0.125]             # ... within this long of the contact
contact2_s = [0.21, 0.23]
hips_m = [0.15, 0.20]             # his hips follow the push
exit_speed = [2.0, 9.0]           # and he drives to the exit side by the release, m/s
drop_m = [0.06, 0.20]             # the sell: the pelvis drops
keep = [0.80, 1.5]                # he keeps this share of his pace



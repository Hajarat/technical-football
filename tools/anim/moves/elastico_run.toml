# Elastico entered at a run, exit to his left (S = left: the RIGHT foot plays): the same move as elastico.toml (same events at the
# same normalised times), drawn on the simulation's running version: after a 0.10 s reach the OUTSIDE of the right foot carries
# the ball 0.30 m to his right over 0.11 s, the foot wraps round the back of the ball without losing it, and at 0.22 s from the
# contact the INSIDE snaps it back across toward the left as the exit touch (the core makes no other touch at the move's end).
# The upper body sells the first direction (hip and shoulder drop to the right), then drives toward the exit. The support (left)
# foot skips under the travelling body: short stances with the foot fixed on the pitch (flagged in [stance], so the runtime holds
# it where it landed), each under about 0.35 m of his travel, and two hops between them with the pelvis rising off the ground and
# settling on each landing; it stands for the snap, then the right foot comes down off the ball as the new support and the left
# swings through to land ahead. Clips elastico_left_run and its mirror elastico_right_run. Conventions as in ball_roll.toml.
#
# Laid out on the jog elastico (skill-clips replay elastico-left-jog, entry 4.6 m/s, easing to 2.5 m/s by the move's end): the
# runtime puts the pose relative to a root that runs straight from the first frame's hips to the last frame's (SkillClip.Root)
# onto his simulated position, so the hips run straight here at an even 4.8 m/s (2.4 m along and 0.2 m toward the exit over the
# clip's 0.5 s) and the ball and the feet are set against them as they are against him in the simulation. The spans give
# normalised t = 2 x seconds, so frame k (60 fps) is at t = k / 30; the stances begin and end on frames.

name = "elastico"
move = "elastico"
side = "left"
foot = "right"
entry = "run"
entry_speed = 2.0
notes = "elastico at a run: outside push 0.30 m away from the exit, the foot wraps round the ball, inside snaps it back across toward the exit as the exit touch; the left foot skips under him in two small hops and stands for the snap, the right comes down off the ball and the left swings through"

[sim]
reach_s = 0.10
move_s = 0.26
push_m = 0.30                     # the outside carries the ball this far away from S ...
push_s = 0.11                     # ... over this long from the contact
contact2_s = 0.22                 # the inside snap (the exit touch), from the contact
exit_deg = 45                     # with the stick released, the ball set across in front of him this far off the run
forward_mps = 2.0                 # the run eases toward this within balance_deceleration
entry_speed = 4.6
ball_start = [-0.04, 0.11, 0.48]
ball_radius = 0.11

[events]
start = 0.0
contact = 0.2                     # the outside meets the ball
contact2 = 0.64                   # the inside snaps it back (the exit touch)
release = 0.72                    # the inside leaves it (the move's end tick)
end = 1.0

[[variant]]
suffix = "_run"
spans = [0.10, 0.22, 0.04, 0.14]

[ball]
radius = 0.11
touch = { contact = "right", contact2 = "right", release = "right" }

# the support foot's four stances and the playing foot's one after the snap (normalised times, on frames 0-6, 11-13, 18-22, 29-30
# and 26-29)
[stance]
left = [[0.0, 0.2], [0.36666, 0.43334], [0.6, 0.73334], [0.96666, 1.0]]
right = [[0.86666, 0.96667]]


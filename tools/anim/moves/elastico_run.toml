# Elastico entered at a run, exit to his left (S = left: the RIGHT foot plays): the same move as elastico.toml (same events at the
# same normalised times), drawn on the simulation's run: he keeps 80% of his pace through it. After a 0.10 s reach the OUTSIDE of
# the right foot carries the ball 0.30 m to his right over 0.11 s, the foot wraps round the back of the ball without losing it,
# and 0.22 s after the contact the INSIDE snaps it back across toward the left as the exit touch. The upper body sells the first
# direction as fully as the standing clip (hip and shoulder drop to the right, the right arm out), then drives toward the exit.
# The support (left) foot skips under the travelling body: short stances fixed on the pitch (flagged in [stance], so the runtime
# holds it where it landed) and two hops between them with the pelvis rising off the ground and settling on each landing; it
# stands for the snap, then the right foot comes down off the ball across toward the exit as the new support and the left swings
# through to land ahead. Clips elastico_left_run and its mirror elastico_right_run. Conventions as in ball_roll.toml.
#
# Laid out on the simulation's path (skill-clips replay elastico-left-jog: entry 4.6 m/s, 5.8 m/s at the contact, 3.7 m/s from
# the snap): every position is the simulation's (his place, the ball's) less where the clip's root is then; the root runs
# straight 2.25 m along the run over the clip. Each label gives the key's time, seconds after the move's start tick. The
# spans give normalised t = 2 x seconds, so frame k (60 fps) is at t = k / 30; the stances begin and end on frames.

name = "elastico"
move = "elastico"
side = "left"
foot = "right"
entry = "run"
entry_speed = 2.0
notes = "elastico at a run: outside push 0.30 m away from the exit, the foot wraps round the ball, inside snaps it back across toward the exit as the exit touch; the left foot skips under him in two hops and stands for the snap, the right comes down off the ball and the left swings through"

[sim]
reach_s = 0.10
move_s = 0.26
push_m = 0.30                     # the outside carries the ball this far away from S ...
push_s = 0.11                     # ... over this long from the contact
contact2_s = 0.22                 # the inside snap (the exit touch), from the contact
run_keep = 0.8                    # he keeps this share of his pace
entry_speed = 4.6
ball_radius = 0.11

[events]
start = 0.0
contact = 0.2                     # the outside meets the ball
contact2 = 0.64                   # the inside snaps it back (the exit touch)
release = 0.72                    # the inside leaves it (the move's end tick)
end = 1.0

[[variant]]
suffix = "_run"
spans = [0.10, 0.22, 0.04, 0.14]

[ball]
radius = 0.11
touch = { contact = "right", contact2 = "right", release = "right" }

# each foot's stances (normalised times)
[stance]
left = [[0.0, 0.134], [0.366, 0.434], [0.59933, 0.734], [0.966, 1.0]]
right = [[0.866, 0.934]]

[[key]]

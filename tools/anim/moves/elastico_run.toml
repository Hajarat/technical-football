ease = 0.0
label = "start: running, the left foot landing ahead of the hips (stance 1), the right passing under him"
pelvis = { pos = [0.0, 0.87, 0.0], pitch = 13 }
chest = { pitch = 6 }
head = { pitch = 26 }
foot_l = { pos = [0.14, 0.002, 0.44], yaw = 6, pitch = 0, toe = 0, knee = [0.15, 0, 1], ease = 1 }
foot_r = { pos = [-0.12, 0.06, 0.02], yaw = -6, pitch = -10, toe = 5, knee = [-0.15, 0, 1] }

# Heel-to-heel from a walk, the right foot leading (mirror: the left). The right foot swings through past the ball on its right and
# comes in in front of it; its heel knocks the ball back and across between the feet, the right foot steps out beside it, and the
# inside of the trailing left foot, turned out behind the ball, pushes it on ahead as he leans into the exit. Hips and shoulders stay
# about square to the run, arms out. Straight ahead, so the clips are named by the leading foot: heel_to_heel_right and its mirror
# heel_to_heel_left (heel_to_heel_run.toml is the same at a run). Conventions as in ball_roll.toml.
#
# Authored to the core (SkillMoves.cs, ActionKind.HeelToHeel): the heel's contact at the start + 0.117 s, the inside's at + 0.217 s,
# the end (release) at + 0.35 s, so the spans play at the core's pace. The ball against the player's position (the clip's root) as
# the replays show it: at the heel's contact 0.39 m ahead at a jog, 0.52 m at a sprint, 0.45 m from a walk, 0.05-0.11 m to the
# leading foot's side; the heel carries it 0.15 m back toward him by the second contact; the flick sends it on at 1.3 x his speed
# (at least 5 m/s). The clip's own ball sits between those, so the pins on the live ball move the boots only a few centimetres.

name = "heel_to_heel"
move = "heel_to_heel"
side = "none"
foot = "right"
entry = "stand"
entry_speed = 0.0
notes = "heel-to-heel from a walk: lead foot past the ball, its heel knocks it back 0.15 m between the feet, the trailing inside flicks it on"

[sim]
move_s = 0.35
contact_s = 0.117                 # the leading heel knocks the ball back ...
knock_back_m = 0.15
contact2_s = 0.217                # ... and the trailing foot's inside flicks it forward
flick_speed = "1.3 x his speed, at least 5 m/s"
entry_speed = 0.0
ball_at_contact = [-0.05, 0.11, 0.48]   # against the root
ball_radius = 0.11

[events]
start = 0.0
contact = 0.2483                  # the leading heel meets the ball
contact2 = 0.4611                 # the trailing foot's inside meets it
release = 0.7447                  # the core's end tick: the ball is away
end = 1.0

[[variant]]
suffix = ""
spans = [0.1167, 0.1, 0.1333, 0.12]

[ball]
radius = 0.11
touch = { contact = "right", contact2 = "left" }


# Heel-to-heel flick from standing, the right foot leading (mirror: the left): the right foot steps just past the ball and its heel knocks it
# back about 0.15 m between the feet, the trailing left foot turns out and its inside flicks the ball forward so it leaves ahead
# of him at speed; he drives forward after it, the trunk leaning into the burst. Not in the simulation yet: authored to the
# numbers it will be built to. Straight ahead, so the clips are named by the leading foot: heel_to_heel_right and its mirror
# heel_to_heel_left (heel_to_heel_run.toml is the same at 3 m/s). Conventions as in ball_roll.toml.

name = "heel_to_heel"
move = "heel_to_heel"
side = "none"
foot = "right"
entry = "stand"
entry_speed = 0.0
notes = "heel-to-heel from standing: lead heel knocks the ball back 0.15 m, the trailing inside flicks it forward at 5.0 m/s"

[sim]
status = "not built: authored to the numbers it will be built to"
move_s = 0.35
contact_s = 0.12                  # the leading heel knocks the ball back ...
knock_back_m = 0.15
contact2_s = 0.22                 # ... and the trailing foot flicks it forward
flick_speed = "1.3 x his speed (5 m/s from standing)"
entry_speed = 0.0
ball_start = [0.0, 0.11, 0.30]
ball_radius = 0.11

[events]
start = 0.0
contact = 0.34                    # the leading heel meets the ball
contact2 = 0.63                   # the trailing foot's inside meets it
release = 0.69                    # it leaves the foot
end = 1.0

[[variant]]
suffix = ""
spans = [0.12, 0.10, 0.02, 0.11]

[ball]
radius = 0.11
touch = { contact = "right", contact2 = "left" }

[[key]]
t = 0.0
ease = 1
label = "start: ready stance, the ball ahead"
pelvis = { pos = [0.0, 0.93, 0.0], pitch = 10 }
chest = { pitch = 6 }
head = { pitch = 26 }
foot_l = { pos = [0.12, 0.002, 0.06], yaw = 6, knee = [0.15, 0, 1], ease = 1 }
foot_r = { pos = [-0.12, 0.002, 0.04], yaw = -6, knee = [-0.15, 0, 1] }
hand_l = { swing = 8, abduct = 14, bend = 40 }
hand_r = { swing = 8, abduct = 14, bend = 40 }
ball = { pos = [0.0, 0.11, 0.3], ease = 0 }

[[key]]
t = 0.2
label = "the right foot steps forward just past the ball, beside it"
pelvis = { pos = [0.0, 0.905, 0.05], pitch = 12 }
foot_r = { pos = [-0.22, 0.06, 0.44], yaw = -8, pitch = 5, toe = 0, knee = [-0.2, 0.2, 1] }

[[key]]
t = 0.34
label = "contact: its heel knocks the ball back between the feet"
pelvis = { pos = [0.01, 0.89, 0.08], pitch = 13, roll = 0 }
chest = { pitch = 10 }
head = { pitch = 34 }
foot_r = { pos = [-0.09, 0.05, 0.62], yaw = -10, pitch = 12, knee = [-0.2, 0.2, 1], ease = 0 }
foot_l = { pos = [0.12, 0.002, 0.06], yaw = 6, ease = 1 }
hand_l = { swing = 10, abduct = 25, bend = 50 }
hand_r = { swing = -5, abduct = 25, bend = 50 }
ball = { pos = [0.0, 0.11, 0.3], ease = 1 }

[[key]]
t = 0.5
label = "the left foot turns out behind the ball to meet it"
foot_l = { pos = [0.08, 0.02, 0.0], yaw = 60, pitch = 0, knee = [0.5, 0.2, 1] }
foot_r = { pos = [-0.15, 0.002, 0.46], yaw = -8, pitch = 0, knee = [-0.2, 0, 1], ease = 1 }

[[key]]
t = 0.63
label = "contact2: the inside of the trailing foot flicks it forward"
pelvis = { pos = [0.0, 0.88, 0.12], pitch = 15 }
foot_l = { pos = [0.0, -0.08, -0.155], frame = "ball", yaw = 75, pitch = 0, knee = [0.6, 0.2, 1], ease = 0 }
ball = { pos = [0.02, 0.11, 0.15], ease = [1, 1, 0] }

[[key]]
t = 0.69
label = "release: the ball away ahead at speed"
foot_l = { pos = [0.0, -0.08, -0.165], frame = "ball", yaw = 70, pitch = 0, ease = 0 }
ball = { pos = [0.02, 0.11, 0.23], ease = [1, 1, 0] }

[[key]]
t = 0.8
label = "the left foot lets the ball go and comes through"
foot_l = { pos = [0.1, 0.07, -0.07], yaw = 40, pitch = 0 }

[[key]]
t = 1
ease = 0.0
label = "end: driving forward after it, the trunk leaning into the burst"
pelvis = { pos = [0.02, 0.9, 0.2], pitch = 18 }
chest = { pitch = 10 }
head = { pitch = 15 }
foot_l = { pos = [0.1, 0.1, 0.38], yaw = 15, pitch = 0, knee = [0.2, 0.2, 1] }
foot_r = { pos = [-0.15, 0.03, 0.46], yaw = -6, pitch = -25, toe = 25 }
hand_l = { swing = 30, abduct = 12, bend = 80 }
hand_r = { swing = -30, abduct = 12, bend = 80 }
ball = { pos = [0.02, 0.11, 0.78], ease = [1, 1, 0] }

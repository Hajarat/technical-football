# Spin (a 360 roulette) toward his left at a run (S = left: the RIGHT sole starts), opening "a": the playing foot coming down ahead of him at the hand-in, the support foot swinging through from behind.
# The simulation keeps 70% of his pace through the turn, so he travels on while turning. The right sole lands on the ball and drags
# it back and round while the left foot plants, skips and pivots under him through the first half turn; the feet swap, the left
# sole takes the ball and drags it on round while the right foot plants as the new pivot; facing his original way at the release
# with the ball ahead of him, he runs on after it. Each support stance is fixed on the pitch (flagged in [stance], so the runtime
# holds the foot where it lands, turning on its spot), with hops between them lifting the foot and the pelvis rising and settling.
# The shoulders and head lead the turn, arms out. Two endings, for the exit touch the core forecasts on the end tick: this file's
# own, for a touch made by the right foot (it leaves its pivot, winds up behind and swings into the ball as the left sole lets
# go; the left lands after the touch), and the ending "_swap", for a touch made by the left (the right hops onto a stance it
# stands on over the touch while the left sole lets go of the ball and pushes it on). Clips spin_left_run, spin_right_run
# and their "_swap" endings. Conventions as in ball_roll.toml.
#
# Laid out on the simulation's path (skill-clips replay spin-left-jog: entry 4.6 m/s, 3.3 m/s by the release) with the core's
# spans (reach, contact to lift 0.25 s, lift to contact2 0.05 s, contact2 to release 0.30 s, settle): every position is the
# simulation's (his place, the ball's) less where the clip's root is then; the root runs straight 3.70 m along the run.
# The pelvis yaw is the simulation's facing at each key (the runtime takes the clip's own heading out and turns him by the
# simulation's), keyed through the full 360 (the channel is a plain number, so it never wraps). Each label gives the key's time,
# seconds after the move's start tick.

name = "spin"
move = "spin"
side = "left"
foot = "right"
entry = "run"
entry_speed = 2.0
notes = "spin at a run, opening a: the right sole drags the ball round through 180 deg while the left foot plants, skips and pivots; feet swap, the left sole completes the 360 while the right foot pivots; the right foot makes the exit touch (the left in the _swap ending)"

[sim]
reach_s = 0.10
lift_s = 0.25                     # the right sole leaves the ball, from the contact
contact2_s = 0.30                 # the feet swap, from the contact
move_s = 0.60                     # contact to the release (the end tick)
turn_deg = 360
run_keep = 0.7                    # he keeps this share of his pace through the turn
entry_speed = 4.6
ball_radius = 0.11

[events]
start = 0.0
contact = 0.14                    # the right sole lands on the ball
lift = 0.44                       # it leaves it, turned 180 degrees
contact2 = 0.48                   # the left sole takes it
release = 0.8                     # the left sole leaves it, turned 360 degrees (the exit touch)
end = 1.0

[[variant]]
suffix = "_run"
spans = [0.12, 0.25, 0.05, 0.3, 0.2]

[ball]
radius = 0.11
on = [["contact", "lift", "right"], ["contact2", "release", "left"]]

# each foot's stances (normalised times)
[stance]
left = [[0.1856, 0.2464], [0.3056, 0.3564], [0.888, 0.947]]
right = [[0.52942, 0.58347], [0.97133, 1.0]]

# The move sheet (data/moves/sheets.json): the ball's legs, the exit rule and how far the left stick may turn its frame.
[sheet]
entry_speed = 4.02             # the pace the root comes in at, m/s
steer_deg = 0

[[sheet.leg]]
from = "contact"
to = "contact2"
anchor = "pitch"
foot = "right"
surface = "sole"

[[sheet.leg]]
from = "contact2"
to = "release"
anchor = "facing"
foot = "left"
surface = "sole"

[sheet.exit]
kind = "touch"
min_deg = -30
max_deg = 30
push = "jog"


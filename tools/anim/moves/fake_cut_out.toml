# Fake shot, cut with the outside of the foot (shoot pressed, cancelled within 0.1 s with the stick held toward the shooting foot's
# own side): from standing, a full shooting wind-up with the plant foot set wide of the ball, then the right leg comes through on the
# ball's left, the foot turned in, and the OUTSIDE of the foot hooks the ball across to his right (60 degrees off the run); the body
# turns right with it into the exit. The simulation plays a cut toward the shooting foot's own side with the outside of that foot
# (SkillMoves.cs: FakeCut, FootSurface.Outside); toward the other side it is the inside hook of fake_cut.toml. fake_cut_out_right
# (right foot) and its mirror fake_cut_out_left (left foot). fake_cut_out_run.toml is the same at 3 m/s. Conventions as in
# ball_roll.toml.

name = "fake_cut_out"
move = "fake_cut"
side = "right"
foot = "right"
entry = "stand"
entry_speed = 0.0
notes = "fake shot, cut: shooting wind-up, the outside of the right foot hooks the ball 60 deg to his right, body turns into the exit"

[sim]
fake_shot_window_s = 0.1          # the cancel must come within 0.1 s of the shoot press (the shot's own wind-up is 0.45 s)
fake_s = 0.1                      # fake_seconds: the move, from the cancel; the hook is at its first tick (no reach)
cut_distance_m = 1.2              # fake_cut_distance: the push reaches 1.2 m from the player ...
cut_time_s = 0.5                  # ... in fake_cut_time
speed_kept = 0.5                  # FakeCutSpeedKept: the player keeps half his entry speed by the end of the move
surface = "outside: the cut is toward the shooting foot's own side"
authored_s = [0.30, 0.10, 0.28]   # press->contact (wind-up and swing), contact->release (the hook carries), release->end (turn)
cut_deg_right = 60
ball_start = [-0.06, 0.11, 0.58]
ball_radius = 0.11

[events]
start = 0.0                       # shoot pressed
contact = 0.5                     # the outside of the foot meets the ball
release = 0.65                    # it leaves it
end = 1.0

[[variant]]
suffix = ""
spans = [0.30, 0.10, 0.28]

[ball]
radius = 0.11
touch = { contact = "right", release = "right" }

# The move sheet (data/moves/sheets.json): the ball's legs, the exit rule and how far the left stick may turn its frame.
[sheet]
steer_deg = 0

[[sheet.leg]]
from = "contact"
to = "release"
anchor = "launch"
foot = "right"
surface = "outside"

[sheet.exit]
kind = "launch"

[[key]]
t = 0.0
ease = 1.0
label = "start: ready stance, the ball a step ahead"
pelvis = { pos = [0.0, 0.93, 0.0], pitch = 8 }
chest = { pitch = 6 }
head = { pitch = 25 }
foot_l = { pos = [0.13, 0.002, 0.06], yaw = 6, knee = [0.15, 0, 1] }
foot_r = { pos = [-0.13, 0.002, 0.06], yaw = -6, knee = [-0.15, 0, 1] }

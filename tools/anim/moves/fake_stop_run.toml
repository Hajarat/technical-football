label = "release: the ball stopped just ahead of where he stops, the sole lets go"
pelvis = { pos = [0.05, 0.83, 1.04], yaw = 0, pitch = 0, roll = 0 }
chest = { yaw = 0, pitch = -8, roll = 0 }
foot_r = { pos = [0.0, 0.11, 0.0], frame = "ball", yaw = -6, pitch = 12, knee = [-0.25, 0.3, 1], ease = 0 }
ball = { pos = [-0.04, 0.11, 1.20], ease = 1 }
head = { yaw = 0, pitch = 44 }
hand_l = { swing = 32, abduct = 60, bend = 25, trail = 90 }
hand_r = { swing = 28, abduct = 55, bend = 25, trail = 90 }

[[key]]

# Fake shot, stop at 3 m/s (shoot pressed, cancelled within 0.1 s with the stick at rest): running, a full shooting wind-up (the left
# foot steps in beside the ball, the right leg drawn back, arms out, trunk over the ball), then the right leg comes through short,
# the sole lands on the ball and stops it under the body, and he ends balanced over it. The simulation has no side for it: the
# foot is the shooting foot, so the clips are named by the foot: fake_stop_right and its mirror fake_stop_left.
# fake_stop.toml is the same from standing (same events). Conventions as in ball_roll.toml.

name = "fake_stop"
move = "fake_stop"
side = "none"
foot = "right"
entry = "run"
entry_speed = 3.0
notes = "fake shot, stop at 3 m/s: shooting wind-up, the leg comes through short, the sole stops the ball under him, balanced over it"

[sim]
fake_shot_window_s = 0.1          # the cancel must come within 0.1 s of the shoot press (the shot's own wind-up is 0.45 s)
fake_s = 0.1                      # fake_seconds: the move, from the cancel, after a sole reach of up to 0.12 s
stop_ahead_m = 0.25               # fake_stop_ahead: the ball comes to rest this far ahead of where he stops (his run dies over the move)
surface = "sole"
authored_s = [0.30, 0.15, 0.25]   # press->contact (wind-up, short swing), contact->release (sole stops the ball), release->end
entry_speed = 3.0
authored_stop_ahead_m = 0.16

[events]
start = 0.0                       # shoot pressed
contact = 0.5                     # the sole lands on the ball
release = 0.65                    # the sole lets go, the ball at rest
end = 1.0

[[variant]]
suffix = "_run"
spans = [0.30, 0.15, 0.25]

[ball]
radius = 0.11
on = ["contact", "release"]

# Travel: 3 m/s into the wind-up (pelvis z 0.36 at t 0.2, 0.65 at the plant, 0.85 at the contact), half of it kept by the end.

[[key]]
t = 0.0
ease = 0.0
label = "start: running in, the right foot swinging through to its last plant"
pelvis = { pos = [0.0, 0.92, 0.0], pitch = 13 }
chest = { pitch = 6 }
head = { pitch = 25 }
foot_l = { pos = [0.13, 0.05, -0.20], yaw = 6, pitch = -25, toe = 25, knee = [0.15, 0, 1] }
foot_r = { pos = [-0.13, 0.08, 0.0], yaw = -6, pitch = 0, knee = [-0.15, 0.1, 1] }
hand_l = { swing = 20, abduct = 14, bend = 70 }
hand_r = { swing = -15, abduct = 14, bend = 70 }
ball = { pos = [-0.04, 0.11, 0.50], ease = [1, 1, 0] }

[[key]]
t = 0.12
label = "the right foot plants"
foot_r = { pos = [-0.13, 0.002, 0.30], yaw = -6, pitch = 0, knee = [-0.15, 0, 1], ease = 1 }

[[key]]
t = 0.2
label = "the long last stride: the left foot reaching for the ball, arms opening"
pelvis = { pos = [0.03, 0.90, 0.36], yaw = -6, pitch = 13, roll = 2 }
chest = { yaw = 2, pitch = 12 }
foot_l = { pos = [0.17, 0.12, 0.45], yaw = 6, pitch = 10, toe = 0, knee = [0.2, 0.1, 1] }
hand_l = { swing = 20, abduct = 35, bend = 35 }
hand_r = { swing = -15, abduct = 30, bend = 35 }

[[key]]
t = 0.21
label = "the right foot pushes off"
foot_r = { pos = [-0.13, 0.002, 0.30], yaw = -6, pitch = -15, toe = 20, ease = 1 }

[[key]]
t = 0.36
label = "top of the backswing: plant foot beside the ball, right leg drawn back, arms out, trunk over the ball"
pelvis = { pos = [0.07, 0.875, 0.65], yaw = -15, pitch = 16, roll = 5 }
chest = { yaw = 6, pitch = 16, roll = -2 }
head = { yaw = -4, pitch = 38 }
foot_l = { pos = [0.21, 0.002, 0.75], yaw = 6, pitch = 0, knee = [0.2, 0, 1], ease = 1 }
foot_r = { pos = [-0.10, 0.30, 0.42], yaw = -10, pitch = -45, toe = 0, knee = [0, -0.6, 1] }
hand_l = { swing = 30, abduct = 55, bend = 30, trail = 90 }
hand_r = { swing = -30, abduct = 40, bend = 30, trail = 90 }

[[key]]
t = 0.44
label = "the swing comes through short, toes up"
pelvis = { yaw = -4 }
foot_r = { pos = [-0.08, 0.21, 0.76], yaw = -6, pitch = 10, knee = [-0.1, 0.4, 1] }

[[key]]
t = 0.5
label = "contact: the sole lands on top of the rolling ball instead of striking it, the body braking back"
pelvis = { pos = [0.06, 0.85, 0.85], yaw = -2, pitch = 4, roll = 2 }
chest = { yaw = 2, pitch = -2, roll = 0 }
head = { yaw = -2, pitch = 42 }
foot_r = { pos = [0.0, 0.108, 0.02], frame = "ball", yaw = -6, pitch = 15, knee = [-0.2, 0.3, 1], ease = 0.3 }
hand_l = { swing = 30, abduct = 55, bend = 28, trail = 90 }

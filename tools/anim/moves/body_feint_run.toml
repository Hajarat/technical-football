# Body feint at a run, selling his left: the simulation keeps 82-89% of his pace and the ball rolls on 0.45 m ahead of him,
# untouched. A short last step on the right foot, then the left swings out and plants hard ahead and wide, the body lunges onto
# it, hip and shoulder dropping left, eyes left, the right arm across; then he comes off it to the right. Same events as
# body_feint.toml. Two endings, for the exit touch the core forecasts on the end tick: this file's own, for a touch made by the
# move's own (left) foot (the right comes down under him off the plant and stands while the left meets the ball), and the
# ending "_swap", for a touch made by the right foot (the left skips off the plant in under him and stands while the right swings
# into the ball). Clips body_feint_left_run, body_feint_right_run and their "_swap" endings.
#
# Laid out on the simulation's path (skill-clips replay body-feint-left-jog: entry 4.6 m/s): every position is the simulation's
# (his place, the ball's) less where the clip's root is then; the root runs straight 2.60 m along the run over the clip.
# Each label gives the key's time, seconds after the move's start tick. A stance is fixed in the clip where its foot lands and
# flagged in [stance] (on whole frames), so the runtime holds the foot on the pitch while the simulation carries him over it; each
# stands under about 0.5 m of his travel or less at a jog or a sprint.

name = "body_feint"
move = "body_feint"
side = "left"
foot = "left"
entry = "run"
entry_speed = 2.0
notes = "body feint at a run: a short step, a wide hard plant and lunge left, shoulder drop, off the plant to the right; the left foot makes the exit touch (the right in the _swap ending)"

[sim]
feint_s = 0.35                    # ExecuteTick to EndTick at a run
entry_speed = 4.6
keep_pace = 0.85                  # he keeps 82-89% of his pace, the ball rolling on 0.45 m ahead, untouched
ball_radius = 0.11

[events]
start = 0.0
contact = 0.35
release = 0.65
end = 1.0

[[variant]]
suffix = "_run"
spans = [0.18, 0.17, 0.25]

[ball]
radius = 0.11

# each foot's stances (normalised times)
[stance]
left = [[0.25861, 0.41529], [0.81287, 0.90713]]
right = [[0.03176, 0.13028], [0.50235, 0.65047], [0.95287, 1.0]]

# The move sheet (data/moves/sheets.json): the ball's legs, the exit rule and how far the left stick may turn its frame.
[sheet]
entry_speed = 4.33             # the pace the root comes in at, m/s
steer_deg = 45

[[sheet.leg]]
from = "start"
to = "release"
anchor = "free"

[sheet.exit]
kind = "touch"
min_deg = 45
max_deg = 90
push = "sprint"


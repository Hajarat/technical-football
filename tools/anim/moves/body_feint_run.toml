# Body feint from a run, selling his left: two short running steps (left, right) under the travelling body, then the left foot
# swings out and plants hard ahead and wide, the body lunges onto it, shoulder and hip dropping left, and he comes off it to the
# right. Same events as body_feint.toml. Two endings, for the exit touch the core forecasts: this file's own, for a touch made by
# the move's own (left) foot (the right foot comes down under him off the plant and stands while the left swings into the ball),
# and the ending "_swap", for a touch made by the right foot (the left skips off the plant to his right and stands under him while
# the right swings into the ball). Clips body_feint_left_run, body_feint_right_run and their "_swap" endings.
#
# Laid out on the simulation's path (skill-clips replay body-feint-left-jog: entry 4.6 m/s, the core keeps him on his line, easing
# to 3 m/s by the end tick): every position is the simulation's (his place, the ball's) less where the clip's root is then; the root
# runs straight 1.8 m along the run over the clip. Each label gives the key's time, seconds after the move's start tick. A
# stance is fixed in the clip where its foot lands and flagged in [stance] (on whole frames), so the runtime holds the foot on the
# pitch where it landed while the simulation carries him over it; each stands under about 0.5 m of his travel or less at a jog or a
# sprint. The left foot has a stance from the first frame (three frames, the runtime taking it from the run onto the clip at once);
# the right starts in the air behind, as the run's flight leaves it, and is first held at its landing before the plant. The root and
# the time map do not keep the same pace (the clip runs at about 0.6 of the simulation's speed before the contact), so a held foot
# and the clip's foot drift apart by up to 0.3 m over a stance; the runtime holds the foot and lets the difference die away after.

name = "body_feint"
move = "body_feint"
side = "left"
foot = "left"
entry = "run"
entry_speed = 2.0
notes = "body feint at a run: two short steps, a wide hard plant and lunge left, shoulder drop, off the plant to the right; the left foot makes the exit touch (the right in the _swap ending)"

[sim]
feint_s = 0.175
close_in_max_s = 0.15
entry_speed = 4.6
ball_radius = 0.11

[events]
start = 0.0
contact = 0.35
release = 0.65
end = 1.0

[[variant]]
suffix = "_run"
spans = [0.18, 0.17, 0.25]

[ball]
radius = 0.11

# each foot's stances (normalised times)
[stance]
left = [[0.0, 0.06546], [0.35529, 0.50353], [0.78953, 0.90713]]
right = [[0.25861, 0.38588], [0.59059, 0.79047], [0.95287, 1.0]]


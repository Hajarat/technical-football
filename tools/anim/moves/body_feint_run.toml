# Body feint at 2 m/s (the ball rolling ahead at his pace), selling his left: the left foot swings out and plants hard ahead and
# wide, the body lunges onto it, then pushes off it to the right. Same events as body_feint.toml. Clips body_feint_left_run,
# body_feint_right_run.

name = "body_feint"
move = "body_feint"
side = "left"
foot = "left"
entry = "run"
entry_speed = 2.0
notes = "body feint at 2 m/s: wide hard plant and lunge left, shoulder drop, push off the left foot to the right"

[sim]
feint_s = 0.25
close_in_max_s = 0.15
authored_s = [0.18, 0.17, 0.25]
entry_speed = 2.0
ball_start = [0.0, 0.11, 0.40]    # rolling ahead at 2 m/s, paced by the simulation
ball_radius = 0.11

[events]
start = 0.0
contact = 0.35
release = 0.65
end = 1.0

[[variant]]
suffix = "_run"
spans = [0.18, 0.17, 0.25]

[ball]
radius = 0.11

# Forward travel at 2 m/s: key t -> seconds -> pelvis z: 0.15 -> 0.077 -> 0.15, 0.35 -> 0.18 -> 0.36, 0.5 -> 0.265 -> 0.53,
# 0.65 -> 0.35 -> 0.70, 0.8 -> 0.457 -> 0.91, 1 -> 0.60 -> 1.20.


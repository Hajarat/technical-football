# Step-over at a run, selling his left: the simulation keeps 89% of his pace through it and the ball rolls on 0.45 m ahead of him,
# untouched. The left foot lifts with the knee across, circles in from the ball's inside, over its front and round its outside
# while the right foot skips twice under the travelling body; the hips swivel and the left shoulder drops, head and eyes going
# left, then the weight comes back to the right. Same events as step_over.toml. Two endings, for the exit touch the core
# forecasts on the end tick: this file's own, for a touch made by the move's own (left) foot (the right lands a third time and
# stands under him while the left comes down outside the ball and meets it), and the ending "_swap", for a touch made by the right
# foot (the left plants wide outside the ball and stands while the right swings into it). Clips step_over_left_run,
# step_over_right_run and their "_swap" endings.
#
# Laid out on the simulation's path (skill-clips replay step-over-left-jog: entry 4.6 m/s, 4.1 m/s through the move): every
# position is the simulation's (his place, the ball's) less where the clip's root is then; the root runs straight 2.85 m along
# the run over the clip. Each label gives the key's time, seconds after the move's start tick. A stance is fixed in the clip where
# its foot lands and flagged in [stance] (on whole frames), so the runtime holds the foot on the pitch while the simulation carries
# him over it; each stands under about 0.5 m of his travel or less at a jog or a sprint, and the support foot's hops between them
# lift it at least 0.06 m with the pelvis rising and settling. The circling foot keeps its path against the live ball.

name = "step_over"
move = "step_over"
side = "left"
foot = "left"
entry = "run"
entry_speed = 2.0
notes = "step-over at a run: the right foot skips twice under him while the left circles over the front of the rolling ball, hip swivel and shoulder drop left, weight back to the right; the left foot makes the exit touch (the right in the _swap ending)"

[sim]
step_over_s = 0.417               # step_over_seconds at a run, ExecuteTick to EndTick
contact_at = "ExecuteTick + half the duration: the foot passes over the ball"
entry_speed = 4.6
keep_pace = 0.89                  # he keeps this share of his pace, the ball rolling on 0.45 m ahead, untouched
ball_radius = 0.11

[events]
start = 0.0
contact = 0.35                    # the foot passes over the front of the ball (ContactTick)
release = 0.65                    # EndTick: the exit touch
end = 1.0

[[variant]]
suffix = "_run"
spans = [0.22, 0.20, 0.25]

[ball]
radius = 0.11

# each foot's stances (normalised times)
[stance]
left = [[0.83153, 0.94913]]
right = [[0.02598, 0.10659], [0.23811, 0.34523], [0.5195, 0.6455], [0.97153, 1.0]]


# Keeper clip list for the audition: the one file edited to add, trim or drop a clip.
#
#   name    GOALS-style <set>_<kind>_<trial>; also the .kclip file name
#   trial   CMU subject_trial (tools/anim/cmu.py fetches exactly the trials listed here)
#   frames  [first, last] AMC frame numbers as written in the file (1-based, 120 Hz), inclusive
#   set     the chooser set (spec appendix F); a set's left and right share clips through mirroring
#   side    which way the source moves or reaches: left / right of the subject, or none
#   events  AMC frame numbers; save sets (catch, reflex_*, body_block, dive_*, back_leap, smother) need "contact"
#   loop    true only for a clip whose end runs into its start (none yet: the matcher treats every clip as one-shot)
#   notes   what the trial shows
#   contact_tolerance_cm  optional: how far a contact foot may stay off the ground (default 2); recorded in clips.json so it can be
#           tightened once milestone 2's foot locking pins the feet
#
# Frame ranges and events were read off each trial's motion (root height and velocity, hand and foot heights; see
# game/assets/anim/SOURCES.md), not from a viewer:
#   contact, reflex_hand  the frame the reaching hand is furthest from the pelvis
#   contact, catch        the frame both hands are furthest in front of the pelvis (catch_high: highest)
#   contact, body_block   the frame both hands are highest
#   contact, reflex_foot  the frame the pelvis is lowest in the lunge
#   contact, dive_low     the frame both hands are lowest
#   contact, smother      the frame both hands are lowest in the dive; landing: the pelvis first within 5 cm of its lowest
#   dive_* and back_leap  takeoff: the last frame before both feet leave the ground (5 cm above where they stood);
#                         contact: the top of the jump (pelvis, or head for the leap); landing: the first foot back down
#   lie_*  landing        the pelvis first within 5 cm of its lowest
#   getup  up             the pelvis first 80 % of the way from its lowest to its final standing height


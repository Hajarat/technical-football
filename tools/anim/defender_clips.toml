# Defender clip list (and the attacker's reactions to him), for the audition: the one file edited to add, trim or drop a clip.
# Same keys as clips.toml (the keeper's); retargeted onto game/assets/characters/player.glb into game/assets/anim/defender/:
#
#   python3 tools/anim/cmu.py --config tools/anim/defender_clips.toml
#   uv run --with numpy python3 tools/anim/retarget.py --config tools/anim/defender_clips.toml \
#       --model game/assets/characters/player.glb --out game/assets/anim/defender
#
# Sets (the chooser's, src/FootballSim.Anim/DefenderChooser.cs):
#   jockey   moving in his stance, facing held: tags "side" (shuffles), "back" (dropping off), "close" (closing down to a stop)
#   set      standing in his stance ("idle": the clip for standing still)
#   lunge    the standing tackle: a step in and a foot out; "contact" is the frame the leading foot is furthest out; side = that foot
#   block    a leg out to the side for a shot; "contact" is its widest frame; side = that leg
#   barge    a shoulder into a runner alongside
#   slide    the slide tackle: no CMU trial has one, so it is the keeper's baked slide (file_from)
#   getup    from the ground after a slide; "up" as in clips.toml
#   stumble, barged, fall   the attacker's: losing his balance, pushed sideways, brought down ("landing" as in clips.toml);
#            a stumble's and a barged clip's "recover" is where he starts to catch himself: the clip is entered before it
#
# Keys beyond clips.toml's:
#   fps        the trial's own frame rate when it is not 120 (subject 77 was recorded at 60)
#   file_from  for source = "baked": the .kclip is copied from this path (relative to game/assets/anim) instead of being baked here
#
# Frame ranges and events were read off each trial's motion (pelvis height and path against its facing, foot reach from the pelvis),
# as for the keeper's list. Every clip has verdict "keep" until the audition says otherwise.


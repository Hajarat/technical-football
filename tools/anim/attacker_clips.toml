# Attacker (outfield player) locomotion clip list: a feasibility spike for driving his stride from motion capture.
# Same keys as clips.toml; retarget onto game/assets/characters/player.glb into game/assets/anim/attacker/:
#
#   python3 tools/anim/cmu.py --config tools/anim/attacker_clips.toml
#   uv run --with numpy python3 tools/anim/retarget.py --config tools/anim/attacker_clips.toml \
#       --model game/assets/characters/player.glb --out game/assets/anim/attacker
#
# contact_speed (default 0.35 m/s): the foot speed under which a low foot counts as planted; a running foot needs more
# (tools/anim/retarget.py label_contacts). contact_tolerance_cm is as in clips.toml.
# No "frames": every clip is its whole trial (they are 0.6 to 4 s long). "set" names the kind of movement; nothing in the game reads it.

[[clip]]
name = "walk_16_47"
trial = "16_47"
set = "walk"
side = "none"
loop = false
notes = "straight walk, about 1.3 m/s (subject 16)"


# Outside of the foot: the toes pointed down and turned in, the outside of the boot through the ball, which leaves toward the
# striking foot's own side while the body runs on; a short follow-through. Right-foot form; see shot_author.py for the frames.

kind = "outside"
surface = "outside"
notes = "outside of the foot: toes down and turned in, the outside of the boot through the ball, a short follow-through"

[ball]
radius = 0.115

[[bin]]
deg = 45
label = "open45"
range = [22.5, 67.5]
body = 0.35

# ---- the approach at a jog: two keys in the ground frame, he starts at the origin running along +Z ----

[entry.run]
entry_speed = 2.8
ball = [-0.10, 1.50]
spans = [0.25, 0.17, 0.05, 0.08, 0.40, 0.20]

[[entry.run.key]]
t = 0.0
label = "start: the right foot planted under him, the left (plant) foot leaving the ground behind"
pelvis = { pos = [0.0, 0.93, 0.0], yaw = 0, pitch = 10, roll = 0 }
chest = { yaw = 8, pitch = 6, roll = 0 }
head = { yaw = 0, pitch = 22 }
foot_r = { pos = [-0.11, 0.002, 0.34], yaw = -4, pitch = 0, toe = 0, knee = [-0.1, 0, 1], ease = 1 }
foot_l = { pos = [0.11, 0.08, -0.48], yaw = 4, pitch = -35, toe = 20, knee = [0.1, 0, 1] }
hand_l = { swing = 25, abduct = 12, bend = 70 }
hand_r = { swing = -20, abduct = 12, bend = 70 }

[[entry.run.key]]
t = 0.12
label = "the right foot still flat as he rides over it"
foot_r = { pos = [-0.11, 0.002, 0.34], yaw = -4, pitch = 0, toe = 0, knee = [-0.1, 0, 1], ease = 1 }

[entry.run.stance]
right = [[0.0, 0.12], [0.9, 1.0]]
left = [[0.5, 0.74]]

[[entry.run.key]]
t = 0.2
label = "takeoff: the right foot pushes off, the left foot flying to its plant"
pelvis = { pos = [0.02, 0.92, 0.62], yaw = 0, pitch = 12, roll = 0 }
chest = { yaw = -6, pitch = 8, roll = 0 }
foot_r = { pos = [-0.11, 0.12, 0.40], yaw = -4, pitch = -45, toe = 25, knee = [-0.1, 0, 1] }
foot_l = { pos = [0.14, 0.16, 0.72], yaw = 4, pitch = 5, toe = 0, knee = [0.1, 0.1, 1] }
hand_l = { swing = -10, abduct = 30, bend = 45 }
hand_r = { swing = 20, abduct = 25, bend = 50 }

# ---- the approach from standing: one step of the plant foot ----

[entry.stand]
entry_speed = 0.0
ball = [-0.10, 0.92]
spans = [0.28, 0.20, 0.05, 0.08, 0.38, 0.20]

[[entry.stand.key]]
t = 0.0
label = "start: standing behind the ball, the left (plant) foot lifting for its step"
pelvis = { pos = [0.0, 0.95, 0.0], yaw = 0, pitch = 4, roll = 0 }
chest = { yaw = 0, pitch = 4, roll = 0 }
head = { yaw = 0, pitch = 28 }
foot_r = { pos = [-0.11, 0.002, 0.0], yaw = -4, pitch = 0, toe = 0, knee = [-0.1, 0, 1], ease = 1 }
foot_l = { pos = [0.11, 0.03, -0.02], yaw = 4, pitch = -10, toe = 10, knee = [0.1, 0, 1] }
hand_l = { swing = 5, abduct = 12, bend = 30 }
hand_r = { swing = -5, abduct = 12, bend = 30 }

[[entry.stand.key]]
t = 0.14
label = "the right foot still flat as the weight goes forward"
foot_r = { pos = [-0.11, 0.002, 0.0], yaw = -4, pitch = 0, toe = 0, knee = [-0.1, 0, 1], ease = 1 }

[entry.stand.stance]
right = [[0.0, 0.14], [0.9, 1.0]]
left = [[0.5, 0.74]]

[[entry.stand.key]]
t = 0.2
label = "takeoff: weight going forward over the stepping left foot, the right heel coming up"
pelvis = { pos = [0.02, 0.90, 0.26], yaw = 0, pitch = 10, roll = 0 }
chest = { yaw = -6, pitch = 8, roll = 0 }
foot_r = { pos = [-0.11, 0.10, 0.08], yaw = -4, pitch = -45, toe = 25, knee = [-0.1, 0, 1] }

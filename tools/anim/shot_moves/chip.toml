hand_l = { swing = 20, abduct = 55, bend = 25, trail = 90 }
hand_r = { swing = -5, abduct = 45, bend = 30, trail = 90 }

[[kick]]
t = 0.66
label = "the foot comes up under where the ball was and stops"
foot_r = { pos = [-0.01, 0.16, -0.04], yaw = 0, pitch = 12, toe = 0, knee = [-0.05, 0.4, 1] }

[[kick]]
t = 0.74
label = "follow-through cut off: the foot hangs low ahead of the plant foot"
pelvis = { pos = [0.07, 0.90, -0.14], yaw = 2, pitch = -4, roll = 1 }
chest = { yaw = -6, pitch = -6, roll = 0 }
foot_l = { pos = [0.21, 0.002, -0.06], yaw = 8, pitch = 0, toe = 0, knee = [0.15, 0, 1], ease = 1 }
foot_r = { pos = [0.0, 0.20, 0.10], yaw = 0, pitch = 10, toe = 0, knee = [-0.05, 0.4, 1] }
hand_l = { swing = 5, abduct = 45, bend = 30, trail = 90 }
hand_r = { swing = 10, abduct = 40, bend = 35, trail = 90 }

[[kick]]
t = 0.9
swing = 0.0
label = "end: the right foot comes down ahead of him"
pelvis = { pos = [0.05, 0.90, 0.04], yaw = 4, pitch = 4, roll = 0 }
chest = { yaw = -6, pitch = 8, roll = 0 }
head = { yaw = 0, pitch = 26 }
foot_l = { pos = [0.21, 0.03, -0.06], yaw = 8, pitch = -25, toe = 20, knee = [0.15, 0, 1] }
foot_r = { pos = [-0.06, 0.002, 0.26], yaw = -2, pitch = 0, toe = 0, knee = [-0.05, 0.1, 1], ease = 1 }

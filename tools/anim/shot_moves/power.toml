hand_r = { swing = -35, abduct = 35, bend = 35, trail = 90 }

[[kick]]
t = 0.5
label = "plant: the left foot lands beside the ball, the knee over it, the right leg starting down"
pelvis = { pos = [0.09, 0.87, -0.40], yaw = -10, pitch = 12, roll = 4 }
chest = { yaw = 12, pitch = 12, roll = -2 }
foot_l = { pos = [0.21, 0.002, -0.06], yaw = 8, pitch = 0, toe = 0, knee = [0.15, 0, 1], ease = 1 }
foot_r = { pos = [-0.11, 0.46, -0.94], yaw = -4, pitch = -65, toe = 0, knee = [-0.05, -0.4, 1] }

[[kick]]
t = 0.6
label = "contact: the laces through the middle of the ball, toes down, the chest over it"
pelvis = { pos = [0.08, 0.87, -0.22], yaw = 0, pitch = 8, roll = 3 }
chest = { yaw = -10, pitch = 14, roll = 0 }
head = { yaw = 0, pitch = 36 }
foot_l = { pos = [0.21, 0.002, -0.06], yaw = 8, pitch = 0, toe = 0, knee = [0.15, 0, 1], ease = 1 }
